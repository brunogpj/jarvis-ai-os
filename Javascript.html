  <script>
    (function () {
      "use strict";
      var root = document.documentElement;
      var sidebar = document.getElementById("sidebar");
      var collapseBtn = document.getElementById("collapseBtn");
      var brandLogo = document.getElementById("brandLogo");
      var themeToggle = document.getElementById("themeToggle");
      var mobileToggle = document.getElementById("mobileToggle");
      var scrim = document.getElementById("scrim");
      var profileBtn = document.getElementById("profileBtn");
      var popover = document.getElementById("profilePopover");

      /* ===================== AUTENTICAÇÃO ===================== */
      var AUTH_KEY = "softapp-token";
      var authToken = localStorage.getItem(AUTH_KEY) || "";
      var currentUser = null;
      var hasBackend = (typeof google !== "undefined" && google.script && google.script.run);

      var loginForm = document.getElementById("loginForm");
      var signupForm = document.getElementById("signupForm");
      var tabLogin = document.getElementById("tabLogin");
      var tabSignup = document.getElementById("tabSignup");
      var loginError = document.getElementById("loginError");
      var signupError = document.getElementById("signupError");
      var avatarInput = document.getElementById("avatarInput");
      var avatarPic = document.getElementById("avatarPic");
      var avatarPlaceholder = avatarPic ? avatarPic.innerHTML : "";
      var avatarData = "";

      function setAuthState(s) {
        document.body.classList.remove("state-checking", "state-anon", "state-authed");
        document.body.classList.add(s);
      }
      function initialsOf(nome) {
        return String(nome || "?").trim().split(/\s+/)
          .map(function (w) { return w.charAt(0); }).slice(0, 2).join("").toUpperCase();
      }
      function applyUser(u) {
        currentUser = u;
        var html = u.avatar ? '<img src="' + u.avatar + '" alt="">' : initialsOf(u.nome);
        document.querySelectorAll(".topbar__profile .avatar, .popover__head .avatar").forEach(function (a) {
          a.innerHTML = html; a.classList.toggle("has-img", !!u.avatar);
        });
        document.querySelectorAll(".topbar__profile .who, .popover__head .who").forEach(function (w) {
          var st = w.querySelector("strong"), sp = w.querySelector("span");
          if (st) st.textContent = u.nome;
          if (sp) sp.textContent = u.email;
        });
        if (typeof loadConversas === "function") loadConversas();
        atualizarStatusHeader();
      }
      /* Atualiza o indicador de status no header (🟢 Online / 🟡 Reserva / 🔴 Sem IA). */
      function atualizarStatusHeader() {
        var el = document.getElementById("chatStatus");
        if (!el || !hasBackend || !authToken) return;
        google.script.run
          .withSuccessHandler(function (s) {
            if (!s) return;
            var cls = s.estado === "reserva" ? "reserva" : (s.estado === "offline" ? "offline" : "");
            el.innerHTML = '<span class="status-dot ' + cls + '"></span> ' + (s.texto || "Online");
            el.title = s.reserva ? "Provedor reserva (OpenRouter/Anthropic/NVIDIA) configurado" : "";
          })
          .withFailureHandler(function () {})
          .estadoAssistente(authToken);
      }
      function showAuthError(el, msg) { el.textContent = msg; el.classList.add("is-show"); }
      function clearAuthError(el) { el.textContent = ""; el.classList.remove("is-show"); }

      function switchTab(which) {
        var isLogin = which === "login";
        tabLogin.classList.toggle("is-active", isLogin);
        tabSignup.classList.toggle("is-active", !isLogin);
        loginForm.classList.toggle("is-active", isLogin);
        signupForm.classList.toggle("is-active", !isLogin);
      }
      tabLogin.addEventListener("click", function () { switchTab("login"); });
      tabSignup.addEventListener("click", function () { switchTab("signup"); });

      /* Redimensiona uma imagem no cliente (máx px) e devolve data URI base64. */
      function resizeImageFile(file, max, cb) {
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var scale = Math.min(1, max / Math.max(img.width, img.height));
            var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
            var c = document.createElement("canvas"); c.width = w; c.height = h;
            c.getContext("2d").drawImage(img, 0, 0, w, h);
            cb(c.toDataURL("image/jpeg", 0.85));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      }

      /* Avatar do cadastro */
      avatarPic.addEventListener("click", function () { avatarInput.click(); });
      avatarInput.addEventListener("change", function () {
        var file = avatarInput.files && avatarInput.files[0];
        if (!file) return;
        resizeImageFile(file, 256, function (d) {
          avatarData = d;
          avatarPic.innerHTML = '<img src="' + d + '" alt="">';
        });
      });

      /* Mostrar/ocultar senha */
      document.querySelectorAll(".pw-toggle").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var input = document.getElementById(btn.getAttribute("data-target"));
          if (!input) return;
          var show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.classList.toggle("is-on", show);
          btn.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha");
        });
      });

      loginForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!hasBackend) { showAuthError(loginError, "Backend indisponível — rode pela URL do Apps Script."); return; }
        clearAuthError(loginError);
        var btn = document.getElementById("loginBtn"); btn.disabled = true;
        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            if (res && res.ok) {
              authToken = res.token; localStorage.setItem(AUTH_KEY, authToken);
              applyUser(res.user); setAuthState("state-authed");
            } else { showAuthError(loginError, (res && res.error) || "Falha no login."); }
          })
          .withFailureHandler(function (err) { btn.disabled = false; showAuthError(loginError, err.message); })
          .login({ email: document.getElementById("loginEmail").value, senha: document.getElementById("loginSenha").value });
      });

      signupForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!hasBackend) { showAuthError(signupError, "Backend indisponível — rode pela URL do Apps Script."); return; }
        clearAuthError(signupError);
        var senha = document.getElementById("suSenha").value, senha2 = document.getElementById("suSenha2").value;
        if (senha !== senha2) { showAuthError(signupError, "As senhas não coincidem."); return; }
        var btn = document.getElementById("signupBtn"); btn.disabled = true;
        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            if (res && res.ok) {
              authToken = res.token; localStorage.setItem(AUTH_KEY, authToken);
              applyUser(res.user); setAuthState("state-authed");
            } else { showAuthError(signupError, (res && res.error) || "Falha no cadastro."); }
          })
          .withFailureHandler(function (err) { btn.disabled = false; showAuthError(signupError, err.message); })
          .signup({
            nome: document.getElementById("suNome").value,
            email: document.getElementById("suEmail").value,
            senha: senha, avatar: avatarData
          });
      });

      function doLogout() {
        if (hasBackend && authToken) { google.script.run.logout(authToken); }
        authToken = ""; currentUser = null; localStorage.removeItem(AUTH_KEY);
        loginForm.reset(); signupForm.reset();
        avatarData = ""; avatarPic.innerHTML = avatarPlaceholder;
        switchTab("login");
        setAuthState("state-anon");
      }

      function bootAuth() {
        if (!hasBackend || !authToken) { setAuthState("state-anon"); return; }
        setAuthState("state-checking");
        google.script.run
          .withSuccessHandler(function (u) {
            if (u) { applyUser(u); setAuthState("state-authed"); }
            else { authToken = ""; localStorage.removeItem(AUTH_KEY); setAuthState("state-anon"); }
          })
          .withFailureHandler(function () { setAuthState("state-anon"); })
          .getSessionUser(authToken);
      }
      /* ===================== EDITAR PERFIL (updateProfile) ===================== */
      var profileModal = document.getElementById("profileModal");
      var profileForm = document.getElementById("profileForm");
      var pmNome = document.getElementById("pmNome");
      var pmEmail = document.getElementById("pmEmail");
      var pmSenha = document.getElementById("pmSenha");
      var pmSenha2 = document.getElementById("pmSenha2");
      var pmError = document.getElementById("pmError");
      var pmOk = document.getElementById("pmOk");
      var pmAvatarPic = document.getElementById("pmAvatarPic");
      var pmAvatarInput = document.getElementById("pmAvatarInput");
      var pmAvatarPlaceholder = pmAvatarPic ? pmAvatarPic.innerHTML : "";
      var pmAvatarData = "";

      function openProfile() {
        if (!currentUser) return;
        popover.classList.remove("is-open");
        clearAuthError(pmError); pmOk.classList.remove("is-show");
        pmNome.value = currentUser.nome || "";
        pmEmail.value = currentUser.email || "";
        pmSenha.value = ""; pmSenha2.value = "";
        pmAvatarData = currentUser.avatar || "";
        pmAvatarPic.innerHTML = pmAvatarData ? '<img src="' + pmAvatarData + '" alt="">' : pmAvatarPlaceholder;
        profileModal.classList.add("is-open");
        profileModal.setAttribute("aria-hidden", "false");
      }
      function closeProfile() {
        profileModal.classList.remove("is-open");
        profileModal.setAttribute("aria-hidden", "true");
      }

      pmAvatarPic.addEventListener("click", function () { pmAvatarInput.click(); });
      pmAvatarInput.addEventListener("change", function () {
        var file = pmAvatarInput.files && pmAvatarInput.files[0];
        if (!file) return;
        resizeImageFile(file, 256, function (d) {
          pmAvatarData = d;
          pmAvatarPic.innerHTML = '<img src="' + d + '" alt="">';
        });
      });

      profileModal.querySelectorAll("[data-close]").forEach(function (el) {
        el.addEventListener("click", closeProfile);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && profileModal.classList.contains("is-open")) closeProfile();
      });

      profileForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!hasBackend) { showAuthError(pmError, "Backend indisponível."); return; }
        clearAuthError(pmError); pmOk.classList.remove("is-show");
        var nome = pmNome.value.trim();
        if (nome.length < 2) { showAuthError(pmError, "Informe seu nome."); return; }
        var payload = { nome: nome, avatar: pmAvatarData };
        if (pmSenha.value) {
          if (pmSenha.value.length < 8) { showAuthError(pmError, "A nova senha deve ter ao menos 8 caracteres."); return; }
          if (pmSenha.value !== pmSenha2.value) { showAuthError(pmError, "As senhas não coincidem."); return; }
          payload.novaSenha = pmSenha.value;
        }
        var btn = document.getElementById("pmSave"); btn.disabled = true;
        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            if (res && res.ok) {
              applyUser(res.user);
              pmSenha.value = ""; pmSenha2.value = "";
              pmOk.classList.add("is-show");
              setTimeout(closeProfile, 1000);
            } else { showAuthError(pmError, (res && res.error) || "Falha ao salvar."); }
          })
          .withFailureHandler(function (err) { btn.disabled = false; showAuthError(pmError, err.message); })
          .updateProfile(authToken, payload);
      });

      /* Gatilhos para abrir o perfil / sair pelo popover */
      var popoverEdit = document.getElementById("popoverEdit");
      if (popoverEdit) popoverEdit.addEventListener("click", openProfile);
      var popoverLogout = document.getElementById("popoverLogout");
      if (popoverLogout) popoverLogout.addEventListener("click", function () { popover.classList.remove("is-open"); doLogout(); });
      // Itens REAIS do popover (substituem os placeholders de template em inglês).
      // showView/perguntarAoJarvis/loadConversas são declarações içadas do mesmo escopo — disponíveis no clique.
      function _popoverAcao(id, fn) {
        var el = document.getElementById(id);
        if (el) el.addEventListener("click", function () {
          popover.classList.remove("is-open");
          profileBtn.setAttribute("aria-expanded", "false");
          try { fn(); } catch (ePa) {}
        });
      }
      _popoverAcao("popoverVozes", function () {
        // Abre o chat e roda o comando /voz (painel de vozes TTS: ouvir e definir).
        setNavActive(document.getElementById("chatNav"));
        showView("chat");
        input.value = "/voz";
        form.dispatchEvent(new Event("submit", { cancelable: true }));
      });
      _popoverAcao("popoverHistorico", function () {
        // Vai para o chat e destaca a lista de conversas na sidebar (recarregada).
        setNavActive(document.getElementById("chatNav"));
        showView("chat");
        try { if (typeof loadConversas === "function") loadConversas(); } catch (eLc) {}
        var lc = document.getElementById("convList");
        if (window.innerWidth <= 860) { sidebar.classList.add("is-mobile-open"); scrim.classList.add("is-open"); }
        if (lc) { try { lc.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (eSc) {} }
      });
      _popoverAcao("popoverTurno", function () {
        // Pergunta o turno vigente — rota direta do Jarvis (resposta imediata, sem custo de IA).
        perguntarAoJarvis("qual meu turno atual?");
      });

      /* ── Preferências do Jarvis (modal do popover, somente dono) ── */
      var prefsModal = document.getElementById("prefsModal");
      var prefsForm = document.getElementById("prefsForm");
      var prefsError = document.getElementById("prefsError");
      var prefsOk = document.getElementById("prefsOk");
      var prefEngine = document.getElementById("prefEngine");
      var prefVoz = document.getElementById("prefVoz");
      var prefEstilo = document.getElementById("prefEstilo");
      var prefVolume = document.getElementById("prefVolume");
      var prefVolumeVal = document.getElementById("prefVolumeVal");
      var prefModoBot = document.getElementById("prefModoBot");
      function _prefsErro(msg) { if (prefsError) { prefsError.textContent = msg; prefsError.classList.add("is-show"); } }
      function fecharPrefs() { if (prefsModal) { prefsModal.classList.remove("is-open"); prefsModal.setAttribute("aria-hidden", "true"); } }
      function abrirPrefs() {
        if (!prefsModal) return;
        prefsError.classList.remove("is-show"); prefsOk.classList.remove("is-show");
        prefsModal.classList.add("is-open"); prefsModal.setAttribute("aria-hidden", "false");
        if (!hasBackend) { _prefsErro("Backend indisponível neste preview."); return; }
        google.script.run
          .withSuccessHandler(function (r) {
            if (!r || !r.ok) { _prefsErro((r && r.erro) || "Falha ao carregar as preferências."); return; }
            prefEngine.value = r.ttsEngine;
            prefVoz.value = r.vozGemini;
            prefEstilo.value = r.estilo;
            prefVolume.value = r.volumeDb; prefVolumeVal.textContent = r.volumeDb;
            prefModoBot.value = r.modoBot;
          })
          .withFailureHandler(function (err) { _prefsErro("⚠️ " + err.message); })
          .getPreferenciasUI(authToken);
      }
      if (prefVolume) prefVolume.addEventListener("input", function () { prefVolumeVal.textContent = prefVolume.value; });
      document.querySelectorAll("[data-prefsclose]").forEach(function (b) { b.addEventListener("click", fecharPrefs); });
      if (prefsForm) prefsForm.addEventListener("submit", function (e) {
        e.preventDefault();
        prefsError.classList.remove("is-show"); prefsOk.classList.remove("is-show");
        var btn = document.getElementById("prefsSave"); if (btn) btn.disabled = true;
        google.script.run
          .withSuccessHandler(function (r) {
            if (btn) btn.disabled = false;
            if (!r || !r.ok) { _prefsErro((r && r.erro) || "Falha ao salvar."); return; }
            prefsOk.classList.add("is-show");
            setTimeout(fecharPrefs, 1400);
          })
          .withFailureHandler(function (err) { if (btn) btn.disabled = false; _prefsErro("⚠️ " + err.message); })
          .salvarPreferenciasUI(authToken, {
            ttsEngine: prefEngine.value,
            vozGemini: prefVoz.value.trim(),
            estilo: prefEstilo.value.trim(),
            volumeDb: Number(prefVolume.value),
            modoBot: prefModoBot.value
          });
      });
      _popoverAcao("popoverPrefs", abrirPrefs);

      /* ── Status do sistema (modal do popover, somente dono) ── */
      var statusModal = document.getElementById("statusModal");
      var statusBody = document.getElementById("statusBody");
      function fecharStatus() { if (statusModal) { statusModal.classList.remove("is-open"); statusModal.setAttribute("aria-hidden", "true"); } }
      function _statusCarregar() {
        if (!statusBody) return;
        statusBody.innerHTML = '<div class="conv-empty">Carregando status…</div>';
        if (!hasBackend) { statusBody.innerHTML = '<div class="conv-empty">Backend indisponível neste preview.</div>'; return; }
        google.script.run
          .withSuccessHandler(function (r) {
            if (!r || !r.ok) { statusBody.innerHTML = '<div class="conv-empty">⚠️ ' + escapeHtml((r && r.erro) || 'Falha ao carregar.') + '</div>'; return; }
            var h = '<div class="pm-divider">Batimentos (processos de fundo)</div>';
            if (r.heartbeat && r.heartbeat.itens && r.heartbeat.itens.length) {
              h += r.heartbeat.itens.map(function (i) {
                var detal = (i.idadeMin == null) ? 'sem batida' : ('há ' + i.idadeMin + ' min (limite ' + i.limiteMin + ')');
                if (!i.ativo) detal = 'inativo (ok)';
                return '<div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px">' +
                  '<span>' + (i.atrasado ? '⚠️' : '✅') + ' ' + escapeHtml(i.nome) + (i.temTrigger ? '' : ' <em style="opacity:.7">(sem gatilho!)</em>') + '</span>' +
                  '<span style="opacity:.72">' + escapeHtml(detal) + '</span></div>';
              }).join('');
            } else { h += '<div class="conv-empty">Sem dados de heartbeat.</div>'; }
            h += '<div class="pm-divider">Provedores de IA (últimas 120 chamadas)</div>';
            if (r.provedores && r.provedores.itens && r.provedores.itens.length) {
              h += r.provedores.itens.map(function (s) { return '<div style="padding:3px 0;font-size:13px">• ' + escapeHtml(s) + '</div>'; }).join('');
              h += '<div style="padding:5px 0 0;font-size:12px;opacity:.72">Prioridade de cota: ' + escapeHtml(String(r.provedores.ordem || '')) + '</div>';
            } else { h += '<div class="conv-empty">Sem chamadas recentes.</div>'; }
            h += '<div class="pm-divider">Rotina</div>';
            var modoRot = ({ auto: 'Automático', secretaria: 'Modo Secretária', off: 'Desligado' })[r.modoBot] || r.modoBot || '—';
            h += '<div style="font-size:13px;line-height:1.9">' +
              '🕗 Turno da semana: <strong>' + (r.turno === 'manha' ? 'manhã' : (r.turno === 'tarde' ? 'tarde' : '—')) + '</strong><br>' +
              '🔔 Alertas de voz ativos: <strong>' + (r.alertasVoz || 0) + '</strong><br>' +
              '💬 Bot do WhatsApp: <strong>' + escapeHtml(modoRot) + '</strong></div>';
            statusBody.innerHTML = h;
          })
          .withFailureHandler(function (err) { statusBody.innerHTML = '<div class="conv-empty">⚠️ ' + escapeHtml(err.message) + '</div>'; })
          .statusSistemaUI(authToken);
      }
      function abrirStatus() {
        if (!statusModal) return;
        statusModal.classList.add("is-open"); statusModal.setAttribute("aria-hidden", "false");
        _statusCarregar();
      }
      document.querySelectorAll("[data-statusclose]").forEach(function (b) { b.addEventListener("click", fecharStatus); });
      var statusRefresh = document.getElementById("statusRefresh");
      if (statusRefresh) statusRefresh.addEventListener("click", _statusCarregar);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (prefsModal && prefsModal.classList.contains("is-open")) fecharPrefs();
          if (statusModal && statusModal.classList.contains("is-open")) fecharStatus();
        }
      });
      _popoverAcao("popoverStatus", abrirStatus);

      bootAuth();

      /* ---------- Tema (persistente) ---------- */
      var savedTheme = localStorage.getItem("softtech-theme");
      if (savedTheme === "dark") { root.setAttribute("data-theme", "dark"); themeToggle.checked = true; }
      themeToggle.addEventListener("change", function () {
        var dark = themeToggle.checked;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        localStorage.setItem("softtech-theme", dark ? "dark" : "light");
      });

      /* ---------- Recolher sidebar (persistente) ---------- */
      if (localStorage.getItem("softtech-collapsed") === "1") sidebar.classList.add("is-collapsed");
      function toggleCollapse() {
        sidebar.classList.toggle("is-collapsed");
        localStorage.setItem("softtech-collapsed", sidebar.classList.contains("is-collapsed") ? "1" : "0");
      }
      collapseBtn.addEventListener("click", toggleCollapse);
      brandLogo.addEventListener("click", function () {
        if (sidebar.classList.contains("is-collapsed")) toggleCollapse();
      });

      /* ---------- Menu mobile ---------- */
      function openMobile() { sidebar.classList.add("is-mobile-open"); scrim.classList.add("is-open"); }
      function closeMobile() { sidebar.classList.remove("is-mobile-open"); scrim.classList.remove("is-open"); }
      mobileToggle.addEventListener("click", openMobile);
      scrim.addEventListener("click", closeMobile);

      /* ---------- Item ativo da navegação ---------- */
      document.querySelectorAll(".nav__item").forEach(function (item) {
        item.addEventListener("click", function () {
          if (item.getAttribute("data-tip") === "Sair") { doLogout(); return; }
          if (item.getAttribute("data-tip") === "Configurações") { openProfile(); return; }
          document.querySelectorAll(".nav__item").forEach(function (i) { i.classList.remove("is-active"); });
          item.classList.add("is-active");
          if (window.innerWidth <= 860) closeMobile();
        });
        item.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); item.click(); }
        });
      });

      /* ---------- Popover de perfil ---------- */
      profileBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = popover.classList.toggle("is-open");
        profileBtn.setAttribute("aria-expanded", open ? "true" : "false");
      });
      document.addEventListener("click", function (e) {
        if (!popover.contains(e.target) && !profileBtn.contains(e.target)) {
          popover.classList.remove("is-open");
          profileBtn.setAttribute("aria-expanded", "false");
        }
      });

      /* ===================== CHAT IA ===================== */
      var messages = document.getElementById("messages");
      var welcome = document.getElementById("welcome");
      var welcomeHTML = welcome ? welcome.outerHTML : "";
      var form = document.getElementById("composer");
      var input = document.getElementById("input");
      var sendBtn = document.getElementById("sendBtn");

      /* ---------- Anexos (imagem / PDF / texto-CSV) + visão/OCR ---------- */
      var imageInput = document.getElementById("imageInput");
      var attachBtn = document.getElementById("attachBtn");
      var attachPreview = document.getElementById("attachPreview");
      var dropzone = document.getElementById("dropzone");
      var pendingAttachments = [];    // MULTI-ANEXO: [{ tipo:'inline'|'texto', mimeType, data, dataUrl, texto, nome, isImage, isVideo, isAudio }]
      var MAX_ANEXOS = 5;             // teto por mensagem (limite prático do request inline da IA)
      var attachmentStore = [];        // anexos já enviados (para abrir ao clicar)
      function _addPending(att) {
        if (pendingAttachments.length >= MAX_ANEXOS) { alert("Máximo de " + MAX_ANEXOS + " anexos por mensagem."); return; }
        pendingAttachments.push(att);
        showAttachPreview(); input.focus();
      }

      var fileIconSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
      function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
      function readAs(file, how, cb) {
        var r = new FileReader();
        r.onload = function () { cb(r.result); };
        if (how === "text") r.readAsText(file); else r.readAsDataURL(file);
      }

      function clearAttachment() {
        pendingAttachments = [];
        attachPreview.hidden = true;
        attachPreview.innerHTML = "";
        imageInput.value = "";
        autoResize();
      }
      function showAttachPreview() {
        if (!pendingAttachments.length) { clearAttachment(); return; }
        var html = pendingAttachments.map(function (a, i) {
          var inner;
          if (a.isImage) inner = '<img class="att-thumb" src="' + a.dataUrl + '" alt="anexo" />';
          else if (a.isVideo) inner = '<span class="att-chip">🎬 <span class="att-name">' + escapeHtml(a.nome) + '</span></span>';
          else if (a.isAudio) inner = '<span class="att-chip">🎤 <span class="att-name">Gravação ' + fmtDur(a.dur || 0) + '</span></span>';
          else inner = '<span class="att-chip">' + fileIconSvg + '<span class="att-name">' + escapeHtml(a.nome) + '</span></span>';
          return '<span class="att-item">' + inner + '<button type="button" class="att-remove" data-rm="' + i + '" aria-label="Remover anexo">&times;</button></span>';
        }).join('');
        attachPreview.innerHTML = html;
        attachPreview.hidden = false;
        attachPreview.querySelectorAll(".att-remove").forEach(function (b) {
          b.addEventListener("click", function () {
            pendingAttachments.splice(Number(b.getAttribute("data-rm")), 1);
            showAttachPreview();
          });

        autoResize();
      }

      function handleFile(file) {
        if (!file) return;
        if (file.size > 15 * 1024 * 1024) { alert("Arquivo muito grande (máx 15 MB)."); return; }
        var type = file.type || "";
        var name = file.name || "arquivo";
        if (type.indexOf("image/") === 0) {
          resizeImageFile(file, 1280, function (dataUrl) {
            var m = dataUrl.match(/^data:([^;]+);base64,(.*)$/); if (!m) return;
            _addPending({ tipo: "inline", mimeType: m[1], data: m[2], dataUrl: dataUrl, nome: name, isImage: true });
          });
        } else if (/^video\//.test(type) || /\.(mp4|m4v|mov|3gp|mkv)$/i.test(name)) {
          // 🎬 Vídeo: o Gemini assiste IMAGEM e ÁUDIO. Inline até ~12 MB (≈1–2 min) por limite da API.
          if (file.size > 12 * 1024 * 1024) { alert("Vídeo muito grande (máx 12 MB ≈ 1–2 min). Corte o trecho relevante e reenvie."); return; }
          readAs(file, "dataurl", function (dataUrl) {
            var res = String(dataUrl), comma = res.indexOf(","); if (comma < 0) return;
            var mt = res.substring(5, comma).split(";")[0] || "video/mp4";
            _addPending({ tipo: "inline", mimeType: mt, data: res.substring(comma + 1), nome: name, isImage: false, isVideo: true });
          });
        } else if (type === "application/pdf" || /\.pdf$/i.test(name)) {
          readAs(file, "dataurl", function (dataUrl) {
            var m = dataUrl.match(/^data:([^;]+);base64,(.*)$/); if (!m) return;
            _addPending({ tipo: "inline", mimeType: "application/pdf", data: m[2], dataUrl: dataUrl, nome: name, isImage: false });
          });
        } else if (/^audio\//.test(type) || /\.(ogg|oga|opus|mp3|wav|m4a|aac|webm|flac)$/i.test(name)) {
          readAs(file, "dataurl", function (dataUrl) {
            var res = String(dataUrl), comma = res.indexOf(","); if (comma < 0) return;
            var mt = res.substring(5, comma).split(";")[0] || "audio/ogg";
            _addPending({ tipo: "inline", mimeType: mt, data: res.substring(comma + 1), nome: name, isImage: false, isAudio: true });
          });
        } else if (/^text\//.test(type) || type === "application/json" || /\.(csv|txt|json|md|tsv|log)$/i.test(name)) {
          readAs(file, "text", function (txt) {
            _addPending({ tipo: "texto", texto: String(txt).slice(0, 200000), nome: name, isImage: false });
          });
        } else {
          alert("Tipo não suportado: " + (type || name) + "\nUse imagem, vídeo, PDF, áudio, CSV ou texto.");
        }
      }

      attachBtn.addEventListener("click", function () { imageInput.click(); });

      /* ---------- Gravação de áudio pelo microfone (com fallback p/ arquivo) ---------- */
      var micBtn = document.getElementById("micBtn");
      var audioInput = document.getElementById("audioInput");
      var micBloqueado = false; // se o sandbox bloquear o microfone, passamos a usar o seletor de arquivo
      if (audioInput) audioInput.addEventListener("change", function () { handleFile(audioInput.files && audioInput.files[0]); audioInput.value = ""; });
      var mediaRec = null, recChunks = [], recStream = null, recAutoStop = null, recStart = 0;
      function fmtDur(s) { var m = Math.floor(s / 60), ss = s % 60; return m + ":" + (ss < 10 ? "0" : "") + ss; }
      function pickRecMime() {
        var prefs = ["audio/ogg;codecs=opus", "audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
        for (var i = 0; i < prefs.length; i++) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(prefs[i])) return prefs[i]; }
        return "";
      }
      function setMicRec(on) {
        if (!micBtn) return;
        micBtn.classList.toggle("is-rec", on);
        micBtn.title = on ? "Parar e anexar a gravação" : "Gravar e enviar áudio (o Jarvis transcreve)";
      }
      function pararGravacao() { if (mediaRec && mediaRec.state === "recording") mediaRec.stop(); }
      if (micBtn) micBtn.addEventListener("click", function () {
        if (mediaRec && mediaRec.state === "recording") { pararGravacao(); return; }
        // Sem suporte OU já bloqueado pelo sandbox → usa o seletor de arquivo (no celular abre o gravador).
        if (micBloqueado || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
          if (audioInput) audioInput.click(); else alert("Gravação indisponível neste navegador.");
          return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          recStream = stream; recChunks = [];
          var mime = pickRecMime();
          mediaRec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
          mediaRec.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
          mediaRec.onstop = function () {
            setMicRec(false);
            if (recAutoStop) { clearTimeout(recAutoStop); recAutoStop = null; }
            if (recStream) { recStream.getTracks().forEach(function (t) { t.stop(); }); recStream = null; }
            var dur = Math.max(1, Math.round((Date.now() - recStart) / 1000));
            var blob = new Blob(recChunks, { type: (recChunks[0] && recChunks[0].type) || mime || "audio/webm" });
            var r = new FileReader();
            r.onload = function () {
              var res = String(r.result), comma = res.indexOf(",");
              if (comma < 0) { alert("Falha ao processar a gravação."); return; }
              var meta = res.substring(5, comma), b64 = res.substring(comma + 1);
              var mt = meta.split(";")[0] || "audio/webm";
              _addPending({ tipo: "inline", mimeType: mt, data: b64, nome: "gravacao-" + fmtDur(dur).replace(":", "m") + "s." + ((mt.split("/")[1] || "webm").split(";")[0]), isImage: false, isAudio: true, dur: dur });
            };
            r.readAsDataURL(blob);
          };
          recStart = Date.now();
          mediaRec.start();
          setMicRec(true);
          recAutoStop = setTimeout(pararGravacao, 120000); // parada automática em 2 min
        }).catch(function (err) {
          setMicRec(false);
          // O sandbox do Apps Script costuma bloquear o microfone → cai para o seletor de arquivo de áudio.
          micBloqueado = true;
          if (audioInput) {
            audioInput.click();
          } else {
            alert("Não foi possível acessar o microfone (" + (err && err.name || "bloqueado") + "). Anexe um arquivo de áudio pelo clipe.");
          }
        });
      });

        chatSection.addEventListener("drop", function (e) {

      /* Colar imagem (Ctrl+V) direto no composer — ex.: print/recorte da área de transferência */
      input.addEventListener("paste", function (e) {

        for (var i = 0; i < items.length; i++) {

      function autoResize() {
        input.style.height = "auto";

      /* Revela o texto progressivamente (sensação de streaming token a token) */
      var prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      function typeOut(el, text, done) {
        text = String(text == null ? "" : text);
        if (prefersReduced || text.length < 2) { el.textContent = text; scrollBottom(); if (done) done(); return; }
        el.textContent = "";
        var i = 0, step = Math.max(2, Math.round(text.length / 350)); // textos longos terminam em ~6s
        var timer = setInterval(function () {
          i += step;
          el.textContent = text.slice(0, i);
          scrollBottom();
          if (i >= text.length) { clearInterval(timer); el.textContent = text; if (done) done(); }
        }, 16);
      }

      function agora() { return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
      // Mostra só a hora se a mensagem for de HOJE; senão prefixa a data (dd/mm/aaaa) — útil ao reabrir conversas antigas.
      function fmtHora(ms) {
        if (!ms) return agora();
        var d = new Date(Number(ms));
        var hora = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        var hoje = new Date();
        var mesmoDia = d.getDate() === hoje.getDate() && d.getMonth() === hoje.getMonth() && d.getFullYear() === hoje.getFullYear();
        return mesmoDia ? hora : (d.toLocaleDateString("pt-BR") + " " + hora);
      }

      function addMessage(role, text, att, tsMs) {
        if (welcome) { welcome.remove(); welcome = null; }

             '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg>') +

        // 🔊 nas respostas CARREGADAS do histórico (as novas ganham o botão no fluxo de envio).
        if (role !== "user" && text && text.length > 1 && hasBackend && String(text).indexOf("⚠️") !== 0) {

      /* P-D · botões 👍/👎 de feedback numa barra de meta. Registra no Firestore via backend. */
      function anexarFeedback(metaEl, texto) {

      /* Separa URLs de imagem gerada (Drive thumbnail) do texto da resposta */
      function extrairImagensGeradas(text) {
        text = String(text == null ? "" : text);
        var urls = [];
        var push = function (id) { urls.push("https://drive.google.com/thumbnail?id=" + id + "&sz=w600"); return ""; };
        var limpo = text
          .replace(/https:\/\/drive\.google\.com\/thumbnail\?id=([A-Za-z0-9_\-]+)(?:&sz=[A-Za-z0-9]+)?/g, function (m, id) { return push(id); })
          .replace(/https:\/\/drive\.google\.com\/file\/d\/([A-Za-z0-9_\-]+)\/[^\s)]*/g, function (m, id) { return push(id); })
          .replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
        return { urls: urls, texto: limpo };
      }

        var vistos = {}, m, achou = false;
        while ((m = re.exec(String(text || ""))) !== null) {

      var _ttsAudioEl = null;

      /* Cloud TTS no servidor (não usa cota Gemini; usa o free tier do Cloud Text-to-Speech). */
      function _cloudTTS(btn, texto) {

          .withSuccessHandler(function (r) {
            btn.disabled = false;

              if (_ttsAudioEl) _ttsAudioEl.pause();

              _ttsAudioEl.onended = function () { btn.innerHTML = "🔊"; btn._tocando = false; };
              _ttsAudioEl.play();
            } catch (e) { btn.innerHTML = "🔊"; }
          })
          .withFailureHandler(function (err) { btn.disabled = false; btn.innerHTML = "🔇"; btn.title = err.message; })
          .sintetizarTexto(authToken, texto);

      /* Botões de CONFIRMAÇÃO P2 (✅/❌) sob o preview de ação sensível — 1 clique em vez de digitar "sim". */

      /* ── Menu de slash commands no composer (porta do Antigravity) ──
       * Digite "/" e aparece o popup com os comandos; clique preenche o campo. */
      var SLASH_CMDS = [
        { cmd: "/voz",      desc: "Painel de vozes TTS (ouvir e escolher)", ex: "/voz" },
        { cmd: "/contatos", desc: "Buscar contato do Google e inserir",     ex: "/contatos Bruno" },
        { cmd: "/imagem",   desc: "Gerar imagem (preset de prompt)",        ex: "/imagem um robô futurista — estilo aquarela, 16:9" },
        { cmd: "/ajuda",    desc: "Ver os comandos disponíveis",            ex: "/ajuda" }
      ];
      (function initSlashMenu() {
        if (!input || !form) return;
        var popup = document.createElement("div");
        popup.id = "slashCmdPopup";
        popup.style.cssText = "position:absolute;bottom:calc(100% + 8px);left:0;right:0;display:none;z-index:60;" +
          "background:var(--glass-bg, rgba(30,36,48,.92));backdrop-filter:blur(14px);border:1px solid var(--glass-border, rgba(255,255,255,.12));" +
          "border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)";
        form.style.position = "relative";
        form.appendChild(popup);
        function render(filtro) {
          var matches = SLASH_CMDS.filter(function (c) { return c.cmd.indexOf(filtro) === 0; });
          if (!matches.length || filtro === matches[0].cmd) { popup.style.display = "none"; return; }
          popup.innerHTML = matches.map(function (c, i) {
            return '<div class="slash-item" data-cmd="' + c.cmd + '" style="padding:9px 14px;cursor:pointer;font-size:12.5px;' +
              (i < matches.length - 1 ? "border-bottom:1px solid var(--glass-border, rgba(255,255,255,.08));" : "") +
              (i === 0 ? "background:rgba(120,160,255,.12);" : "") + '">' +
              '<b style="color:var(--accent, #7aa2ff)">' + c.cmd + '</b> <span style="opacity:.65">— ' + c.desc + '</span>' +
              '<br><small style="opacity:.45">Ex.: ' + c.ex + "</small></div>";
          }).join("");
          popup.style.display = "block";
          popup.querySelectorAll(".slash-item").forEach(function (el) {
            el.addEventListener("mousedown", function (ev) { // mousedown: dispara antes do blur do input
              ev.preventDefault();
              input.value = el.getAttribute("data-cmd") + " ";
              input.focus(); popup.style.display = "none";
              if (typeof autoResize === "function") autoResize();
            });
          });
        }
        input.addEventListener("input", function () {
          var v = input.value;
          if (v.charAt(0) === "/" && v.indexOf(" ") === -1) render(v); else popup.style.display = "none";
        });
        input.addEventListener("blur", function () { setTimeout(function () { popup.style.display = "none"; }, 160); });
        input.addEventListener("keydown", function (e) { if (e.key === "Escape") popup.style.display = "none"; });
      })();

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = input.value.trim();
        var atts = pendingAttachments.slice(); // MULTI-ANEXO: cópia (o clear zera o original)
        var att = atts[0] || null;             // 1º anexo = "principal" (compatibilidade com os fluxos existentes)
        if (!text && !att) return;
        // Comando /ajuda — lista os comandos disponíveis (local, sem IA).
        if (!att && /^\/ajuda\b/i.test(text)) {
          addMessage("user", text); input.value = ""; clearAttachment();
          var linhasAjuda = SLASH_CMDS.map(function (c) { return c.cmd + " — " + c.desc + " (ex.: " + c.ex + ")"; }).join("\n");
          addMessage("ai", "📋 Comandos disponíveis:\n\n" + linhasAjuda);
          return;
        }
        // Comando /imagem — preset de geração: com argumento reescreve e envia; sem, insere o modelo.
        if (!att && /^\/imagem\b/i.test(text)) {
          var restoImg = text.replace(/^\/imagem\b/i, "").trim();
          if (restoImg) {
            text = "Gere uma imagem de " + restoImg;
          } else {
            input.value = "Gere uma imagem de [descrição] — estilo [realista/aquarela/cartoon/neon], proporção [1:1/16:9/9:16]";
            autoResize(); input.focus();
            return;
          }
        }
        // Comando /voz — abre o seletor de vozes (ouvir + definir) sem chamar a IA.
        if (!att && /^\/voz\b/i.test(text)) {
          addMessage("user", text); input.value = ""; clearAttachment();
          var tv = showTyping();
          google.script.run
            .withSuccessHandler(function (r) { tv.remove(); renderVozPanel(r); })
            .withFailureHandler(function (err) { tv.remove(); addMessage("ai", "⚠️ " + err.message); })
            .vozesTTS(authToken);
          return;
        }
        // Comando /contatos [termo] — lista/busca contatos do Google e insere no campo ao escolher.
        if (!att && /^\/contatos\b/i.test(text)) {
          var termoC = text.replace(/^\/contatos\b/i, "").trim();
          addMessage("user", text); input.value = ""; clearAttachment();
          var tc = showTyping();
          google.script.run
            .withSuccessHandler(function (r) { tc.remove(); renderContatosPanel(r); })
            .withFailureHandler(function (err) { tc.remove(); addMessage("ai", "⚠️ " + err.message); })
            .contatosUI(authToken, termoC);
          return;
        }
        var userWrap = addMessage("user", text || (atts.length > 1 ? "(" + atts.length + " anexos)" : "(anexo)"), att);
        // MULTI-ANEXO: os demais anexos aparecem como chips extras na bolha do usuário.
        if (atts.length > 1) {
          try {
            var bodyU = userWrap.querySelector(".msg__body") || userWrap;
            var extrasEl = document.createElement("div");
            extrasEl.className = "msg__extras";
            extrasEl.textContent = "📎 " + atts.slice(1).map(function (a) { return a.nome || "arquivo"; }).join(" · ");
            bodyU.appendChild(extrasEl);
          } catch (eEx) {}
        }
        var attEl = userWrap.querySelector("[data-att]");
        input.value = ""; clearAttachment();
        var typing = showTyping();
        // Até 30 turnos: o servidor COMPRIME os antigos (Memory Summarization — porta do Antigravity).
        var snapshot = chatHistory.slice(-30);
        var wasNew = !conversaId;
        var t0 = Date.now();
        var _toPayload = function (a) {
          return a.tipo === "inline"
            ? { tipo: "inline", mimeType: a.mimeType, data: a.data, nome: a.nome }
            : { tipo: "texto", nome: a.nome, texto: a.texto };
        };
        var payload = null;
        if (atts.length === 1) payload = _toPayload(atts[0]);
        else if (atts.length > 1) payload = { tipo: "multi", anexos: atts.map(_toPayload) };
        askBackend(text, snapshot, payload, function (res) {
          typing.remove();
          res = res || {};
          var lat = ((Date.now() - t0) / 1000).toFixed(1);
          var reply = res.resposta || "(sem resposta)";
          // Status ao vivo no header: 🔁 modo reserva → 🟡; resposta normal → 🟢.
          var stEl = document.getElementById("chatStatus");
          if (stEl) {
            if (reply.indexOf("🔁") === 0) stEl.innerHTML = '<span class="status-dot reserva"></span> Modo reserva';
            else if (reply.indexOf("⚠️") !== 0) stEl.innerHTML = '<span class="status-dot"></span> Online';
          }
          // Anexo salvo no Drive → o chip passa a abrir o Google Drive
          if (res.anexoUrl && attEl) {
            var idx = Number(attEl.getAttribute("data-att"));
            if (attachmentStore[idx]) attachmentStore[idx].driveUrl = res.anexoUrl;
            attEl.title = "Abrir no Drive" + (res.categoria ? " · " + res.categoria : "");
          }
          if (res.conversaId) { conversaId = res.conversaId; if (wasNew && typeof loadConversas === "function") loadConversas(); }
          var parsed = extrairImagensGeradas(reply); // separa miniaturas de imagem do texto
          var aiWrap = addMessage("ai", "");
          typeOut(aiWrap.querySelector(".msg__text"), parsed.texto, function () {
            parsed.urls.forEach(function (u) { anexarImagemGerada(aiWrap, u); });
            anexarYouTube(aiWrap, parsed.texto);
            if (res.sugereIngestao && res.fileId) adicionarBotaoIngestao(aiWrap, res.fileId, res.categoria);
            var body = aiWrap.querySelector(".msg__body");
            if (body) {
              var meta = document.createElement("div");
              meta.className = "msg__meta";
              meta.innerHTML = '<span>⏱ respondido em ' + lat + 's</span>';
              // Botão 🔊 ouvir — sintetiza a resposta via Cloud TTS (não usa cota do Gemini).
              if (hasBackend && parsed.texto && parsed.texto.length > 1) {
                var ouvir = document.createElement("button");
                ouvir.type = "button"; ouvir.className = "msg__tts"; ouvir.title = "Ouvir resposta";
                ouvir.innerHTML = "🔊";
                ouvir.addEventListener("click", function () { ouvirResposta(ouvir, parsed.texto); });
                meta.appendChild(ouvir);
              }
              anexarFeedback(meta, parsed.texto);
              // MODO ESPELHO: você mandou áudio → a resposta volta em áudio (player + autoplay).
              if (res.audioResposta && res.audioResposta.base64) {
                var player = document.createElement("audio");
                player.controls = true;
                player.src = "data:" + (res.audioResposta.mime || "audio/mpeg") + ";base64," + res.audioResposta.base64;
                player.style.cssText = "display:block;margin-top:8px;height:32px;max-width:280px";
                body.appendChild(player);
                try { var pp = player.play(); if (pp && pp.catch) pp.catch(function () {}); } catch (ePl) {}
              }
              body.appendChild(meta);
            }
            // Preview de ação sensível (P2) → botões ✅ Confirmar / ❌ Cancelar (1 clique).
            if (/Confirma[çc][ãa]o necess[áa]ria/i.test(parsed.texto)) anexarConfirmacao(aiWrap);
            // Chips de PRÓXIMOS PASSOS (porta do Antigravity): clicar envia a sugestão como mensagem.
            if (res.sugestoes && res.sugestoes.length) anexarSugestoes(aiWrap, res.sugestoes);
            scrollBottom();
          });
          chatHistory.push({ role: "user", text: text || (atts.length > 1 ? ("[" + atts.length + " anexos: " + atts.map(function (a) { return a.nome || "arquivo"; }).join(", ") + "]") : ("[anexo: " + (att ? att.nome : "arquivo") + "]")) });
          chatHistory.push({ role: "assistant", text: parsed.texto || reply });
        });

      /* ===================== HISTÓRICO DE CONVERSAS ===================== */
      var convList = document.getElementById("convList");

          .withSuccessHandler(renderConvList)
          .withFailureHandler(function () {})
          .listarConversas(authToken);

      function renderConvList(res) {
        if (!convList) return;
        convList.innerHTML = "";
        var convs = (res && res.conversas) || [];
        if (!convs.length) { convList.innerHTML = '<li class="conv-empty">Sem conversas ainda</li>'; return; }
        convs.forEach(function (c) {
          var li = document.createElement("li");
          li.className = "conv-item" + (c.id === conversaId ? " is-active" : "");
          li.innerHTML = '<span class="conv-title"></span>' +
            '<button class="conv-edit" title="Renomear" aria-label="Renomear">✎</button>' +
            '<button class="conv-del" title="Excluir" aria-label="Excluir">&times;</button>';

          li.querySelector(".conv-title").addEventListener("click", function () { abrirConversa(c.id); });

          li.querySelector(".conv-del").addEventListener("click", function (e) { e.stopPropagation(); excluirConversaUI(c.id); });
          convList.appendChild(li);

      function renomearConversaUI(id, atual) {
        var novo = window.prompt("Renomear conversa:", atual || "");
        if (novo == null) return;
        novo = novo.trim();
        if (!novo || novo === atual) return;
        google.script.run
          .withSuccessHandler(function (r) { if (r && r.ok) loadConversas(); })
          .withFailureHandler(function () {})
          .renomearConversa(authToken, id, novo);
      }

      function novaConversa() {
        conversaId = null;
        chatHistory = [];
        attachmentStore = [];
        clearAttachment();
        if (typeof showView === "function") showView("chat");
        messages.innerHTML = welcomeHTML;
        welcome = document.getElementById("welcome");
        if (convList) [].forEach.call(convList.querySelectorAll(".conv-item.is-active"), function (li) { li.classList.remove("is-active"); });
        if (window.innerWidth <= 860) closeMobile();

      function abrirConversa(id) {
        if (!hasBackend) return;

      /* ===== Mini-framework de CARDS INTERATIVOS (data-cardkey + data-act + data-id) ===== */
      var IC_REG = {

      };
      function icRun(fnName, args, btn, okMsg, oldTxt) {
        var row = btn ? btn.closest(".av-row") : null;
        var delay = 0;
        if (row && btn) {
          var act = btn.getAttribute("data-act");
          if (act === "autorizar" || act === "aprovar") {
            row.classList.add("approved");
            delay = 450;
          } else if (act === "negar" || act === "remover" || act === "cancelar" || act === "excluir" || act === "ignorar") {
            row.classList.add("rejected");

        setTimeout(function() {
          var runner = google.script.run
            .withSuccessHandler(function (r) {

            .withFailureHandler(function (e) {

              }
              if (btn) {

                btn.textContent = oldTxt;

      function wireActCard(cardEl, cardKey) {

              var inpDesc = cardEl.querySelector(".ic-add-in.mon-desc");
              var urlVal = inpUrl ? inpUrl.value.trim() : "";

            var inp = cardEl.querySelector(".ic-add-in"); var val = inp ? inp.value.trim() : "";
            if (!val || !reg.__add) { if (inp) inp.focus(); return; }

          var btn = ev.target.closest("[data-act]"); if (!btn) return;

          var act = btn.getAttribute("data-act");
          var row = btn.closest("[data-id]"); if (!row) return;
          var id = row.getAttribute("data-id");
          
          if (act === "resolver") {
            row.classList.add("rejected");
            btn.disabled = true;
            google.script.run
              .withSuccessHandler(function(r) {
                toast(r && r.ok ? "Feedback resolvido 🗑️" : "⚠️ erro");

              })
              .withFailureHandler(function(e) {
                toast("⚠️ Falha: " + e.message);
                row.classList.remove("rejected");
                btn.disabled = false;
              })
              .uiRevisaoResolver(authToken, id, "", true);
          } else if (act === "corrigir") {
            var box = row.querySelector(".revis-corr-box");
            if (box) box.hidden = !box.hidden;
          }
        });
        
        card.querySelectorAll(".av-row").forEach(function(row) {

            });

              ev.stopPropagation();

      function wireWikiDragDrop(cards) {
        var dragZone = cards.querySelector("#wikiDragDropZone");

          dragZone.addEventListener("dragover", function (e) {
            e.preventDefault();
            dragZone.classList.add("dragover");
          });
          dragZone.addEventListener("dragleave", function (e) {
            e.preventDefault();
            dragZone.classList.remove("dragover");
          });
          dragZone.addEventListener("drop", function (e) {
            e.preventDefault();
            dragZone.classList.remove("dragover");
            var files = e.dataTransfer.files;
            if (files.length) {
              var file = files[0];
              var reader = new FileReader();
              reader.onload = function (event) {
                var base64 = event.target.result.split(',')[1];
                toast("Subindo arquivo para a Wiki: " + file.name + "...");
                google.script.run
                  .withSuccessHandler(function (r) {
                    toast(r && r.ok ? r.mensagem : ("⚠️ " + ((r && r.erro) || "falha")));
                    loadDashboard();
                  })
                  .withFailureHandler(function (err) {
                    toast("⚠️ " + err.message);
                  })
                  .uiUploadEIngerir(authToken, base64, file.name, file.type);
              };
              reader.readAsDataURL(file);
            }
          });
          dragZone.addEventListener("click", function () {
            var input = document.createElement("input");
            input.type = "file";
            input.onchange = function (e) {
              var files = e.target.files;
              if (files.length) {
                var file = files[0];
                var reader = new FileReader();
                reader.onload = function (event) {
                  var base64 = event.target.result.split(',')[1];
                  toast("Subindo arquivo para a Wiki: " + file.name + "...");

                reader.readAsDataURL(file);
              }
            };
            input.click();
          });
        }
      }

      function pendRun(fn, args, btn, okMsg, ob) {

          .withFailureHandler(function (e) { toast("⚠️ " + e.message); if (btn) { btn.disabled = false; btn.textContent = ob; } });
        runner[fn].apply(runner, [authToken].concat(args));

      function wirePendCard(cardEl) {
        cardEl.addEventListener("click", function (ev) {
          var btn = ev.target.closest("[data-act]"); if (!btn) return;
          ev.stopPropagation();
          var act = btn.getAttribute("data-act");
          if (act === "togglemode") {                 /* liga/desliga o Modo Secretária (sem id) */
            var turnOn = !btn.classList.contains("on"); var ob0 = btn.textContent; btn.disabled = true; btn.textContent = "…";
            pendRun("uiToggleSecretaria", [turnOn], btn, turnOn ? "Modo Secretária LIGADO 🛡️" : "Modo Secretária desligado", ob0); return;
          }
          var row = btn.closest(".pend-row"); var id = row ? row.getAttribute("data-id") : ""; if (!id) return;
          var ob = btn.textContent;
          if (act === "aprovar") { btn.disabled = true; btn.textContent = "…"; pendRun("uiPendenciaResponder", [id, ""], btn, "Resposta enviada ✅", ob); }
          else if (act === "ignorar") { btn.disabled = true; pendRun("uiPendenciaIgnorar", [id], btn, "Pendência ignorada 🗑️", ob); }
          else if (act === "editar") { pendAbrirEdit(cardEl, id); }
        });
      }

        var box = cardEl.querySelector(".pend-form"); if (!box) return;

          '<textarea class="av-t pend-edit-t" rows="3"></textarea>' +

        box.querySelector(".pend-edit-t").value = p.rascunho || "";
        box.hidden = false; box.scrollIntoView({ block: "nearest" });
        box.querySelector(".pend-cancel").onclick = function () { box.hidden = true; box.innerHTML = ""; };
        box.querySelector(".pend-send").onclick = function () {

      function loadWppInstancias() {
        if (!hasBackend) { wppInstancesEl.innerHTML = '<div class="conv-empty">Backend indisponível.</div>'; return; }
        wppInstancesEl.innerHTML = '<div class="conv-empty">Carregando…</div>';
        google.script.run

      function renderWpp(res) {
        if (res && res.dashboardUrl && wppDashboard) { wppDashboard.href = res.dashboardUrl; wppDashboard.hidden = false; }
        if (wppWebhookBtn) {
          if (res && res.botAtivo) { wppWebhookBtn.textContent = "✅ Bot ativo"; wppWebhookBtn.classList.add("is-on"); wppWebhookBtn.title = "O Jarvis está recebendo as mensagens. Clique para reativar."; }
          else { wppWebhookBtn.textContent = "⚡ Ativar bot"; wppWebhookBtn.classList.remove("is-on"); }
        }
        if (!res || !res.ok) { wppInstancesEl.innerHTML = '<div class="conv-empty">🔒 ' + ((res && res.error) || "Restrito ao proprietário.") + '</div>'; return; }
        var insts = res.instancias || [];
        if (!insts.length) { wppInstancesEl.innerHTML = '<div class="conv-empty">Nenhuma instância configurada.</div>'; return; }
        wppInstName = insts[0].nome; // instância principal (WhatsApp pessoal)
        wppInstancesEl.innerHTML = "";
        insts.forEach(function (i) {
          var conectado = String(i.estado).toUpperCase() === "CONNECTED";
          var card = document.createElement("div");
          card.className = "wpp-card";
          card.innerHTML =
            '<h3></h3>' +
            '<div class="wpp-badge ' + (conectado ? "on" : "off") + '"><span class="dot"></span><span class="est"></span></div>' +
            (i.numero ? '<div class="wpp-num"></div>' : '') +
            '<button type="button">' + (conectado ? "Reconectar" : "Conectar / Ver QR") + '</button>';
          card.querySelector("h3").textContent = i.nome;
          card.querySelector(".est").textContent = conectado ? "Conectado" : (i.estado || "desconectado");
          if (i.numero) card.querySelector(".wpp-num").textContent = "📱 " + i.numero + (i.perfil ? " · " + i.perfil : "");
          card.querySelector("button").addEventListener("click", function () { conectarWpp(i.nome); });
          wppInstancesEl.appendChild(card);
        });
      }

      function abrirQr(titulo, html) { qrTitle.textContent = titulo; qrBody.innerHTML = html; qrModal.classList.add("is-open"); qrModal.hidden = false; }
      function fecharQr() { qrModal.classList.remove("is-open"); qrModal.hidden = true; qrBody.innerHTML = ""; if (wppPoll) { clearInterval(wppPoll); wppPoll = null; } }

      function conectarWpp(nome) {
        abrirQr("Conectar: " + nome, '<div class="qr-spin"></div><div class="qr-status">Obtendo QR Code…</div>');
        google.script.run
          .withSuccessHandler(function (r) {
            if (!r || !r.ok) { qrBody.innerHTML = '<div class="qr-status">⚠️ ' + ((r && r.error) || "Falha.") + '</div>'; return; }
            if (r.status === "CONNECTED") { qrBody.innerHTML = '<div class="qr-status">✅ Já conectado' + (r.numero ? " (" + r.numero + ")" : "") + ".</div>"; loadWppInstancias(); return; }
            if (r.status === "QRCODE" && r.base64) {
              var src = String(r.base64).indexOf("data:") === 0 ? r.base64 : ("data:image/png;base64," + r.base64);
              qrBody.innerHTML = '<img src="' + src + '" alt="QR Code"><div class="qr-status">No WhatsApp: Aparelhos conectados → Conectar aparelho → escaneie.</div>';
              iniciarPoll(nome);
            } else { qrBody.innerHTML = '<div class="qr-status">' + (r.erro || "QR não disponível. Tente novamente.") + '</div>'; }
          })
          .withFailureHandler(function (err) { qrBody.innerHTML = '<div class="qr-status">⚠️ ' + err.message + '</div>'; })
          .wppConectar(authToken, nome);
      }

      function iniciarPoll(nome) {
        if (wppPoll) clearInterval(wppPoll);
        wppPoll = setInterval(function () {
          google.script.run.withSuccessHandler(function (r) {
            if (r && r.ok && String(r.status).toUpperCase() === "CONNECTED") {
              clearInterval(wppPoll); wppPoll = null;
              qrBody.innerHTML = '<div class="qr-status">✅ Conectado com sucesso!</div>';
              loadWppInstancias();
              setTimeout(fecharQr, 1800);
            }
          }).withFailureHandler(function () {}).wppStatus(authToken, nome);
        }, 4000);
      }

      function ativarBotWpp() {
        if (!wppWebhookBtn) return;
        wppWebhookBtn.disabled = true; wppWebhookBtn.textContent = "Ativando…";
        google.script.run
          .withSuccessHandler(function (r) {
            wppWebhookBtn.disabled = false;
            if (r && r.ok) { wppWebhookBtn.textContent = "✅ Bot ativo"; wppWebhookBtn.classList.add("is-on"); loadWppInstancias(); }
            else { wppWebhookBtn.textContent = "⚡ Ativar bot"; wppWebhookBtn.classList.remove("is-on"); alert("⚠️ " + ((r && r.error) || "Falha ao ativar o bot.")); }
          })
          .withFailureHandler(function (err) { wppWebhookBtn.disabled = false; wppWebhookBtn.textContent = "⚡ Ativar bot"; alert("⚠️ " + err.message); })
          .wppApontarWebhook(authToken, wppInstName || "");
      }

      if (qrModal) qrModal.querySelectorAll("[data-qrclose]").forEach(function (el) { el.addEventListener("click", fecharQr); });

      /* ===================== CONTROLE DO DISPOSITIVO (CELULAR) ===================== */
      var dispTelemetryList = document.getElementById("dispTelemetryList");
      var dispLogsList = document.getElementById("dispLogsList");
      var simAcaoSelect = document.getElementById("simAcao");
      var simIntentFields = document.getElementById("simIntentFields");
      var simTextoInput = document.getElementById("simTexto");
      var simEnviarBtn = document.getElementById("simEnviarBtn");
      var dispRefreshBtn = document.getElementById("dispRefresh");
      var dispositivoNav = document.getElementById("dispositivoNav");

      if (simAcaoSelect) {
        simAcaoSelect.addEventListener("change", function () {
          var val = simAcaoSelect.value;
          if (val === "intent") {
            simIntentFields.style.display = "flex";
            simTextoInput.hidden = true;
          } else {
            simIntentFields.style.display = "none";
            simTextoInput.hidden = false;
            if (val === "abrirUrl") simTextoInput.placeholder = "URL / deep-link (ex: youversion://bible?reference=MAT.6.7&version=212)";
            else if (val === "abrirApp") simTextoInput.placeholder = "nome do app (ex: whatsapp, spotify, configuracoes)";
            else if (val === "navegar") simTextoInput.placeholder = "destino (ex: Trabalho, Casa, endereço)";
            else if (val === "falar") simTextoInput.placeholder = "texto a falar (TTS)";
            else if (val === "notificar") simTextoInput.placeholder = "texto da notificação";
          }
        });
      }

      function loadDispositivo() {
        if (!dispTelemetryList || !dispLogsList || !authToken) return;
        dispTelemetryList.innerHTML = "<li>Carregando status de telemetria...</li>";
        dispLogsList.innerHTML = "<li>Carregando logs do celular...</li>";
        google.script.run
          .withSuccessHandler(function (r) {
            if (!r || !r.ok) {
              dispTelemetryList.innerHTML = "<li>⚠️ Falha ao obter dados: " + (r ? r.erro : "erro") + "</li>";
              dispLogsList.innerHTML = "<li>⚠️ Sem conexão com o histórico.</li>";
              return;
            }
            var t = r.telemetria;
            if (t) {
              // HONESTIDADE: quando a macro não substitui o magic-text, o backend devolve "" — mostrar
              // "indisponível" em vez de um default enganoso ("Não conectado"/"Não"/"Normal").
              var ND = '<span style="opacity:.55">— indisponível <i style="font-size:11px">(macro não enviou)</i></span>';
              var batV = String(t.bateria_nivel || t.bateria || '').trim();
              var bat = batV ? (batV.replace(/%\s*$/, '') + '%') : ND;
              // [power] do MacroDroid responde em PT: "Ligar"=conectado / "Desligar"=desconectado.
              var chargV = String(t.carregando || '').trim().toLowerCase();
              var charg = !chargV ? ND
                : (/deslig|discharg|false|n[aã]o/.test(chargV) ? "Não"
                : (/lig|charging|carregando|true|\bac\b|usb|plugged|full|sim/.test(chargV) ? "Sim" : chargV));
              var wifi = String(t.wifi_nome || t.wifi || '').trim() || ND;
              // modo_som numérico = volume do toque ([vol_ring]); texto = modo (normal/vibrar/silencioso).
              var soundV = String(t.modo_som || '').trim();
              var sound = !soundV ? ND : (/^\d+$/.test(soundV) ? ("Volume do toque: " + soundV + "%") : soundV);
              // A telemetria só chega JUNTO com um comando de voz (não há ping periódico) → pode estar velha.
              var idade = ND;
              if (t.recebidoEm) {
                var difMin = Math.round((Date.now() - new Date(t.recebidoEm).getTime()) / 60000);
                var quando = new Date(t.recebidoEm).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
                var rel = difMin < 1 ? "agora" : (difMin < 60 ? ("há " + difMin + " min") : ("há " + Math.round(difMin / 60) + " h"));
                idade = quando + ' <span style="opacity:.7">(' + rel + ')</span>' +
                  (difMin > 15 ? ' <span style="color:#e0a000;font-weight:600">⚠️ desatualizado</span>' : '');
              }
              dispTelemetryList.innerHTML =
                "<li><b>🔋 Nível da Bateria:</b> " + bat + "</li>" +
                "<li><b>🔌 Carregando:</b> " + charg + "</li>" +
                "<li><b>🔊 Modo de Som:</b> " + sound + "</li>" +
                "<li><b>📶 Wi-Fi:</b> " + wifi + "</li>" +
                "<li><b>🕒 Última atualização:</b> " + idade + "</li>";
            } else {
              dispTelemetryList.innerHTML = "<li>Nenhum dado de telemetria recebido ainda. Envie um comando de voz para inicializar.</li>";
            }

            if (r.logs && r.logs.length > 0) {
              dispLogsList.innerHTML = r.logs.map(function (l) {
                var color = l.ok ? "var(--accent)" : "#ff6b6b";
                var icon = l.ok ? "✅" : "⚠️";
                var ts = new Date(l.ts).toLocaleTimeString("pt-BR");
                return "<li class='av-row' style='display:flex; flex-direction:column; padding: 10px; border-bottom:1px solid var(--glass-border);'>" +
                  "<div style='display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;'>" +
                  "  <span style='color:" + color + "; font-weight:bold;'>" + icon + " " + l.tool + "</span>" +
                  "  <span style='opacity:0.6;'>" + ts + "</span>" +
                  "</div>" +
                  "<div style='font-size:12.5px; opacity:0.85;'>" + l.resumo + "</div>" +
                  "</li>";
              }).join("");
            } else {
              dispLogsList.innerHTML = "<li>Nenhum comando registrado no log.</li>";
            }
          })
          .withFailureHandler(function (err) {
            dispTelemetryList.innerHTML = "<li>⚠️ Erro: " + err.message + "</li>";
            dispLogsList.innerHTML = "<li>⚠️ Erro: " + err.message + "</li>";
          })
          .obterStatusDispositivo(authToken);
      }

      if (dispRefreshBtn) {
        dispRefreshBtn.addEventListener("click", function () {
          // Pede telemetria FRESCA ao celular (ping no webhook jarvis_telemetria) e recarrega em seguida.
          dispRefreshBtn.disabled = true;
          dispRefreshBtn.textContent = "Pedindo ao celular…";
          google.script.run
            .withSuccessHandler(function () {
              setTimeout(function () {
                dispRefreshBtn.disabled = false;
                dispRefreshBtn.textContent = "Atualizar Status";
                loadDispositivo();
              }, 3500); // dá tempo do MacroDroid responder com o POST de telemetria
            })
            .withFailureHandler(function () {
              dispRefreshBtn.disabled = false;
              dispRefreshBtn.textContent = "Atualizar Status";
              loadDispositivo();
            })
            .pingTelemetria();
        });
      }

      if (simEnviarBtn) {
        simEnviarBtn.addEventListener("click", function () {
          var acao = simAcaoSelect.value;
          var args = {};
          if (acao === "intent") {
            args.intent_action = document.getElementById("simIntentAction").value.trim();
            args.intent_package = document.getElementById("simIntentPackage").value.trim();
            args.intent_data = document.getElementById("simIntentData").value.trim();
            if (!args.intent_action) { alert("Ação do intent é obrigatória."); return; }
          } else {
            var val = simTextoInput.value.trim();
            if (!val) { alert("Preencha o campo de texto/destino."); return; }
            if (acao === "navegar") args.destino = val;
            else if (acao === "falar") args.texto = val;
            else if (acao === "notificar") args.texto = val;
            else if (acao === "abrirUrl") args.url = val;
            else if (acao === "abrirApp") args.nome = val;
          }
          simEnviarBtn.disabled = true;
          simEnviarBtn.textContent = "Disparando...";
          google.script.run
            .withSuccessHandler(function (r) {
              simEnviarBtn.disabled = false;
              simEnviarBtn.textContent = "Disparar Webhook no Celular";
              if (r && r.ok) {
                toast("Comando enviado com sucesso!");
                loadDispositivo();
              } else {
                alert("Falha: " + (r ? r.erro : "erro desconhecido"));
              }
            })
            .withFailureHandler(function (err) {
              simEnviarBtn.disabled = false;
              simEnviarBtn.textContent = "Disparar Webhook no Celular";
              alert("Erro: " + err.message);
            })
            .dispararComandoDispositivo(authToken, acao, args);
        });
      }

      // Ações Rápidas: um toque dispara o comando REAL no celular (os deep-links que funcionam).
      (function () {
        var host = document.getElementById("dispQuickActions");
        if (!host) return;
        var ACOES = [
          { icon: "💬", label: "WhatsApp", acao: "abrirApp", args: { nome: "whatsapp" } },
          { icon: "📨", label: "Telegram", acao: "abrirApp", args: { nome: "telegram" } },
          { icon: "📖", label: "Bíblia (Mt 6:7)", acao: "abrirUrl", args: { url: "youversion://bible?reference=MAT.6.7&version=212" } },
          { icon: "🎵", label: "Spotify: louvor", acao: "abrirUrl", args: { url: "https://open.spotify.com/search/louvor" } },
          { icon: "▶️", label: "YouTube: louvor", acao: "abrirUrl", args: { url: "https://www.youtube.com/results?search_query=louvor" } },
          { icon: "🛒", label: "Mercado Livre", acao: "abrirUrl", args: { url: "meli://search?query=fone%20de%20ouvido" } },
          { icon: "🗺️", label: "Rota: Trabalho", acao: "navegar", args: { destino: "Trabalho" } },
          { icon: "🏠", label: "Rota: Casa", acao: "navegar", args: { destino: "Casa" } },
          { icon: "⚙️", label: "Configurações", acao: "abrirApp", args: { nome: "configuracoes" } },
          { icon: "🔊", label: "Falar (teste)", acao: "falar", args: { texto: "Olá Bruno, aqui é o Jarvis testando a fala no seu celular." } },
          { icon: "⏯️", label: "Pausar/Tocar", acao: "midia", args: { comando: "pausar" } },
          { icon: "⏭️", label: "Próxima faixa", acao: "midia", args: { comando: "proxima" } },
          { icon: "🔦", label: "Lanterna", acao: "lanterna", args: {} },
          { icon: "🔉", label: "Volume alto", acao: "volume", args: { nivel: "alto" } },
          { icon: "🔇", label: "Mudo", acao: "volume", args: { nivel: "mudo" } },
          { icon: "🌙", label: "Não perturbe ON", acao: "naoperturbe", args: { estado: "on" } },
          { icon: "🔔", label: "Não perturbe OFF", acao: "naoperturbe", args: { estado: "off" } },
          // ROTINAS COMPOSTAS: um clique → várias ações (rotina: nome em vez de acao/args).
          { icon: "🎬", label: "Modo cinema", rotina: "cinema" },
          { icon: "☀️", label: "Sair do cinema", rotina: "cinema_off" },
          { icon: "🎯", label: "Modo foco", rotina: "foco" }
        ];
        host.innerHTML = "";
        ACOES.forEach(function (a) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "btn-ghost";
          b.style.cssText = "display:flex;align-items:center;gap:7px;justify-content:flex-start;font-size:12.5px;padding:9px 10px;text-align:left;cursor:pointer;";
          b.innerHTML = '<span style="font-size:15px">' + a.icon + '</span> ' + a.label;
          b.addEventListener("click", function () {
            var orig = b.innerHTML;
            b.disabled = true;
            b.innerHTML = '<span style="font-size:15px">' + a.icon + '</span> Disparando…';
            var runner = google.script.run
              .withSuccessHandler(function (r) {
                b.disabled = false; b.innerHTML = orig;
                if (r && r.ok) {
                  // Rotina informa quantas das N ações passaram (o não perturbe ainda depende de permissão no MIUI).
                  toast("📲 " + a.label + (r.executadas ? " · " + r.executadas + " ações" : " disparado no celular!"));
                  loadDispositivo();
                } else { alert("Falha: " + (r ? r.erro : "erro desconhecido")); }
              })
              .withFailureHandler(function (err) { b.disabled = false; b.innerHTML = orig; alert("Erro: " + err.message); });
            if (a.rotina) runner.executarRotinaUI(authToken, a.rotina);
            else runner.dispararComandoDispositivo(authToken, a.acao, a.args);
          });
          host.appendChild(b);
        });
      })();

      if (dispositivoNav) {
        dispositivoNav.addEventListener("click", function () {
          setNavActive(dispositivoNav);
          showView("dispositivo");
          loadDispositivo();   // auto-carrega telemetria+logs ao abrir (antes só via botão "Atualizar Status")
          if (window.innerWidth <= 860) closeMobile();
        });
      }
    })();
  </script>
