<style>
    /* ============================================================
       DESIGN TOKENS — Neumorphism + Glassmorphism
       Estratégia (ver wiki/concepts): vidro nas camadas flutuantes
       (sidebar, topbar, composer) sobre fundo com gradiente;
       neumorfismo nos controles táteis (toggle de tema, botões).
       ============================================================ */
    :root {
      /* Acento (teal/cyan da marca Softtech) */
      --accent:        #0fb5be;
      --accent-2:      #22d3d3;
      --accent-soft:   rgba(15, 181, 190, 0.14);
      --accent-ring:   rgba(15, 181, 190, 0.45);

      /* Texto */
      --text:          #2c2a4f;
      --text-soft:     #5f6589;
      --text-mute:     #9aa0bd;

      /* Glassmorphism */
      --glass-bg:      rgba(255, 255, 255, 0.60);
      --glass-bg-strong: rgba(255, 255, 255, 0.78);
      --glass-border:  rgba(255, 255, 255, 0.70);
      --glass-blur:    18px;
      --glass-shadow:  0 18px 48px rgba(31, 38, 80, 0.16);

      /* Neumorphism (controles táteis) */
      --neu-bg:        #e7eaf2;
      --neu-light:     #ffffff;
      --neu-dark:      #c4cbdd;

      /* Fundo da página (gradiente — pré-requisito do glassmorphism) */
      --bg-base:       #eef0f6;
      --bg-blob-1:     #d3f4f3;
      --bg-blob-2:     #e8e4ff;
      --bg-blob-3:     #dcecff;

      /* Geometria / movimento */
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --sidebar-w: 274px;
      --sidebar-w-collapsed: 84px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --speed: 0.34s;

      --badge-bg: #38c9d6;
      --badge-text: #ffffff;
    }

    html[data-theme="dark"] {
      --accent:        #22d3d3;
      --accent-2:      #5ef0ee;
      --accent-soft:   rgba(34, 211, 211, 0.16);
      --accent-ring:   rgba(34, 211, 211, 0.5);

      --text:          #e9ebf6;
      --text-soft:     #aeb4d2;
      --text-mute:     #7e85a8;

      --glass-bg:      rgba(24, 28, 48, 0.55);
      --glass-bg-strong: rgba(26, 30, 52, 0.78);
      --glass-border:  rgba(255, 255, 255, 0.09);
      --glass-shadow:  0 18px 48px rgba(0, 0, 0, 0.45);

      --neu-bg:        #1a1d30;
      --neu-light:     #262a44;
      --neu-dark:      #0c0e1c;

      --bg-base:       #0d0f1e;
      --bg-blob-1:     #123043;
      --bg-blob-2:     #231a47;
      --bg-blob-3:     #0f2236;

      --badge-bg: #22d3d3;
      --badge-text: #0d0f1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: var(--bg-base);
      background-image:
        radial-gradient(60% 60% at 0% 0%, var(--bg-blob-1) 0%, transparent 60%),
        radial-gradient(55% 55% at 100% 0%, var(--bg-blob-2) 0%, transparent 58%),
        radial-gradient(70% 60% at 50% 100%, var(--bg-blob-3) 0%, transparent 60%);
      background-attachment: fixed;
      transition: background-color var(--speed) var(--ease);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Padrão de pontos sutil, como no estudo de caso */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image: radial-gradient(currentColor 1px, transparent 1px);
      background-size: 26px 26px;
      color: var(--text);
      opacity: 0.035;
      pointer-events: none;
      z-index: 0;
    }

    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
      backdrop-filter: blur(var(--glass-blur)) saturate(150%);
      box-shadow: var(--glass-shadow);
      transform: translateZ(0);
    }
    /* Fallback p/ navegadores sem backdrop-filter (ex.: GAS em browsers antigos) */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background: var(--glass-bg-strong); }
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 18px;
      height: 100vh;
      padding: 18px;
    }

    /* ===================== SIDEBAR ===================== */
    .sidebar {
      display: flex;
      flex-direction: column;
      width: var(--sidebar-w);
      flex-shrink: 0;
      border-radius: var(--radius-lg);
      padding: 16px 14px;
      transition: width var(--speed) var(--ease);
      overflow: hidden;
    }
    .sidebar.is-collapsed { width: var(--sidebar-w-collapsed); }

    /* Marca */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 14px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 12px;
    }
    .brand__logo {
      width: 42px; height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      display: grid; place-items: center;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--glass-border);
    }
    .brand__text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
    .brand__text strong { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .brand__text span { font-size: 12px; color: var(--text-mute); }
    .brand__collapse {
      margin-left: auto;
      width: 30px; height: 30px;
      border-radius: 9px;
      border: none; cursor: pointer;
      display: grid; place-items: center;
      color: var(--text-soft);
      background: var(--neu-bg);
      box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light);
      transition: box-shadow 0.18s var(--ease), color 0.18s, transform var(--speed) var(--ease);
    }
    .brand__collapse:hover { color: var(--accent); }
    .brand__collapse:active { box-shadow: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light); }
    .brand__collapse svg { transition: transform var(--speed) var(--ease); }
    .sidebar.is-collapsed .brand__collapse svg { transform: rotate(180deg); }

    .sidebar.is-collapsed .brand { justify-content: center; padding-inline: 0; }
    .sidebar.is-collapsed .brand__text { display: none; }
    .sidebar.is-collapsed .brand__collapse { display: none; }

    /* Botão flutuante de expandir quando recolhido */
    .sidebar.is-collapsed .brand__logo { cursor: pointer; }

    /* Navegação */
    .nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 2px; }
    .nav::-webkit-scrollbar { width: 6px; }
    .nav::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

    .nav__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text-mute);
      padding: 14px 12px 8px;
      white-space: nowrap;
    }
    .sidebar.is-collapsed .nav__label {
      text-align: center;
      padding-inline: 0;
      font-size: 0;
    }
    .sidebar.is-collapsed .nav__label::after {
      content: "•••";
      font-size: 10px;
      letter-spacing: 0.1em;
    }

    .nav__list { list-style: none; display: flex; flex-direction: column; gap: 3px; }

    .nav__item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-soft);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
      white-space: nowrap;
    }
    .nav__chevron {
      flex-shrink: 0;
      color: var(--text-mute);
      transition: transform 0.18s var(--ease), color 0.18s;
    }
    .nav__icon { flex-shrink: 0; display: grid; place-items: center; width: 22px; }
    .nav__text { flex: 1; overflow: hidden; text-overflow: ellipsis; }

    .nav__badge {
      flex-shrink: 0;
      min-width: 20px; height: 20px;
      padding: 0 6px;
      border-radius: 10px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 11px; font-weight: 700;
      display: grid; place-items: center;
    }

    .nav__item:hover { background: var(--accent-soft); color: var(--text); }
    .nav__item:hover .nav__chevron { color: var(--accent); }
    .nav__item:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }

    .nav__item.is-active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      border-color: var(--glass-border);
    }
    .nav__item.is-active .nav__icon,
    .nav__item.is-active .nav__chevron { color: var(--accent); }
    .nav__item.is-active::before {
      content: "";
      position: absolute; left: -14px; top: 50%;
      transform: translateY(-50%);
      width: 4px; height: 22px;
      border-radius: 0 4px 4px 0;
      background: var(--accent);
    }

    /* Estado recolhido: só ícones + tooltip */
    .sidebar.is-collapsed .nav__item { justify-content: center; padding: 12px 0; }
    .sidebar.is-collapsed .nav__chevron,
    .sidebar.is-collapsed .nav__text { display: none; }
    .sidebar.is-collapsed .nav__badge {
      position: absolute; top: 6px; right: 14px;
      min-width: 8px; height: 8px; padding: 0;
      font-size: 0; border-radius: 50%;
    }
    .sidebar.is-collapsed .nav__item.is-active::before { left: -14px; }

    .sidebar.is-collapsed .nav__item[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute; left: calc(100% + 12px); top: 50%;
      transform: translateY(-50%);
      background: #1c2030; color: #fff;
      padding: 6px 11px; border-radius: 8px;
      font-size: 12.5px; font-weight: 500;
      white-space: nowrap; z-index: 50;
      box-shadow: 0 8px 22px rgba(0,0,0,0.28);
      pointer-events: none;
    }

    /* Rodapé: toggle de tema neumórfico */
    .sidebar__footer {
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .theme-toggle {
      display: inline-flex; align-items: center; gap: 10px;
      cursor: pointer; color: var(--text-mute);
    }
    .theme-toggle .ico-sun { color: #f0a830; }
    html[data-theme="dark"] .theme-toggle .ico-sun { color: var(--text-mute); }
    .theme-toggle .ico-moon { color: var(--text-mute); }
    html[data-theme="dark"] .theme-toggle .ico-moon { color: var(--accent); }

    .switch { position: relative; width: 50px; height: 28px; flex-shrink: 0; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch__track {
      position: absolute; inset: 0;
      border-radius: 999px;
      background: var(--neu-bg);
      box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light);
      transition: background 0.2s;
    }
    .switch__knob {
      position: absolute; top: 3px; left: 3px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--neu-light);
      box-shadow: 2px 2px 5px var(--neu-dark), -2px -2px 5px var(--neu-light);
      transition: transform var(--speed) var(--ease), background 0.2s;
    }
    .switch input:checked + .switch__track .switch__knob { transform: translateX(22px); background: var(--accent); }
    .switch input:focus-visible + .switch__track { outline: 2px solid var(--accent-ring); outline-offset: 2px; }

    .sidebar.is-collapsed .theme-toggle .ico-sun,
    .sidebar.is-collapsed .theme-toggle .ico-moon { display: none; }

    /* ===================== MAIN ===================== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      /* Eleva a topbar (e o popover de perfil) acima do painel de chat.
         Sem isto, o backdrop-filter de .chat cria um contexto de
         empilhamento que cobre o popover. */
      position: relative;
      z-index: 30;
    }
    .topbar__menu {
      display: none;
      width: 38px; height: 38px;
      border: none; border-radius: 10px; cursor: pointer;
      color: var(--text-soft);
      background: var(--neu-bg);
      box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light);
      place-items: center;
    }
    .topbar__heading { display: flex; flex-direction: column; line-height: 1.2; }
    .topbar__heading h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .topbar__heading p { font-size: 12.5px; color: var(--text-mute); }
    .topbar__status {
      margin-left: 4px;
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-mute);
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--glass-border);
    }
    .topbar__status .dot { width: 8px; height: 8px; border-radius: 50%; background: #2fcf6b; box-shadow: 0 0 0 3px rgba(47,207,107,0.18); }

    .profile-wrap { margin-left: auto; position: relative; }
    .topbar__profile {
      display: flex; align-items: center; gap: 10px;
      padding: 5px 6px 5px 5px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--glass-bg);
      cursor: pointer; color: var(--text);
      transition: box-shadow 0.18s;
    }
    .topbar__profile:hover { box-shadow: 0 6px 18px rgba(31,38,80,0.16); }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #6a7bff);
      color: #fff; display: grid; place-items: center;
      font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .topbar__profile .who { display: flex; flex-direction: column; line-height: 1.15; text-align: left; padding-right: 6px; }
    .topbar__profile .who strong { font-size: 13.5px; }
    .topbar__profile .who span { font-size: 11.5px; color: var(--text-mute); }

    /* Popover de perfil (como no estudo de caso) */
    .popover {
      position: absolute; top: calc(100% + 10px); right: 0;
      width: 268px;
      border-radius: var(--radius-md);
      padding: 8px;
      opacity: 0; visibility: hidden; transform: translateY(-6px);
      transition: opacity 0.18s, transform 0.18s, visibility 0.18s;
      z-index: 60;
    }
    .popover.is-open { opacity: 1; visibility: visible; transform: translateY(0); }
    .popover__head { display: flex; align-items: center; gap: 11px; padding: 10px; border-bottom: 1px solid var(--glass-border); margin-bottom: 6px; }
    .popover__head .who { display: flex; flex-direction: column; line-height: 1.2; }
    .popover__head .who strong { font-size: 14px; }
    .popover__head .who span { font-size: 12px; color: var(--text-mute); }
    .popover__item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px; border-radius: 9px;
      color: var(--text-soft); text-decoration: none;
      font-size: 13.5px; cursor: pointer;
    }
    .popover__item:hover { background: var(--accent-soft); color: var(--text); }
    .popover__item svg { color: var(--text-mute); }
    .popover__foot { padding: 10px; font-size: 11.5px; color: var(--text-mute); border-top: 1px solid var(--glass-border); margin-top: 6px; }

    /* ===================== CHAT IA ===================== */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      /* Mantém o chat abaixo da topbar no empilhamento (ver nota em .topbar). */
      position: relative;
      z-index: 1;
    }
    .chat__messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px clamp(16px, 6vw, 90px);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .chat__messages::-webkit-scrollbar { width: 8px; }
    .chat__messages::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 6px; }

    .welcome { margin: auto; text-align: center; max-width: 540px; padding: 30px 0; }
    .welcome__badge {
      width: 64px; height: 64px; margin: 0 auto 18px;
      border-radius: 20px; display: grid; place-items: center;
      color: var(--accent); background: var(--accent-soft);
      border: 1px solid var(--glass-border);
    }
    .welcome h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .welcome p { color: var(--text-soft); font-size: 14.5px; line-height: 1.6; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
    .chip {
      padding: 9px 14px; border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-soft); font-size: 13px; cursor: pointer;
      transition: color 0.18s, border-color 0.18s, transform 0.18s;
    }
    .chip:hover { color: var(--accent); border-color: var(--accent-ring); transform: translateY(-1px); }

    .msg { display: flex; gap: 13px; max-width: 760px; }
    .msg__avatar {
      width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0;
      display: grid; place-items: center; font-weight: 700; font-size: 12px;
    }
    .msg__avatar.user { background: linear-gradient(135deg, var(--accent), #6a7bff); color: #fff; }
    .msg__avatar.ai { color: var(--accent); background: var(--accent-soft); border: 1px solid var(--glass-border); }
    .msg__body { padding-top: 5px; }
    .msg__who { font-size: 12.5px; font-weight: 600; color: var(--text-mute); margin-bottom: 4px; }
    .msg__time { font-weight: 500; opacity: .6; margin-left: 8px; font-variant-numeric: tabular-nums; }
    .msg__meta { font-size: 11.5px; color: var(--text-mute); opacity: .7; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .msg.is-user .msg__meta { text-align: right; }
    .msg__text { font-size: 14.5px; line-height: 1.65; color: var(--text); white-space: pre-wrap; }
    .msg.is-user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.is-user .msg__who { text-align: right; }
    .msg.is-user .msg__text {
      background: var(--accent-soft);
      border: 1px solid var(--glass-border);
      padding: 11px 15px; border-radius: 14px 14px 4px 14px;
    }

    .typing { display: inline-flex; gap: 4px; padding: 6px 0; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-mute); animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,60%,100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

    /* Composer (input) — glass */
    .composer {
      margin: 0 clamp(12px, 5vw, 70px) clamp(12px, 4vw, 22px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 20px;
    }
    .composer__row { display: flex; align-items: flex-end; gap: 10px; }
    .composer__attach {
      width: 40px; height: 40px; flex-shrink: 0;
      border: none; border-radius: 12px; cursor: pointer;
      display: grid; place-items: center;
      color: var(--text-soft); background: var(--neu-bg);
      box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light);
      transition: color 0.18s, box-shadow 0.15s;
    }
    .composer__attach:hover { color: var(--accent); }
    .composer__attach:active { box-shadow: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light); }
    .composer__attach.is-rec { color: #fff; background: #e0245e; box-shadow: 0 0 0 0 rgba(224,36,94,.6); animation: micPulse 1.2s infinite; }
    @keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(224,36,94,.55); } 70% { box-shadow: 0 0 0 10px rgba(224,36,94,0); } 100% { box-shadow: 0 0 0 0 rgba(224,36,94,0); } }
    .composer__preview {
      position: relative; align-self: flex-start;
      padding: 4px;
      display: flex; flex-wrap: wrap; gap: 8px; /* MULTI-ANEXO: chips lado a lado */
    }
    .att-item { position: relative; display: inline-flex; }
    .att-remove {
      position: absolute; top: -6px; right: -6px;
      width: 22px; height: 22px; border-radius: 50%;
      border: none; cursor: pointer; line-height: 1;
      background: #1c2030; color: #fff; font-size: 14px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .msg__extras { margin-top: 6px; font-size: 12px; opacity: 0.75; word-break: break-word; }
    .composer__preview img {
      max-height: 84px; max-width: 160px; border-radius: 12px;
      border: 1px solid var(--glass-border); display: block; object-fit: cover;
    }
    #attachRemove {
      position: absolute; top: -6px; right: -6px;
      width: 22px; height: 22px; border-radius: 50%;
      border: none; cursor: pointer; line-height: 1;
      background: #1c2030; color: #fff; font-size: 14px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .composer textarea {
      flex: 1;
      border: none; outline: none; resize: none;
      background: transparent;
      color: var(--text);
      font: inherit; font-size: 14.5px; line-height: 1.5;
      max-height: 160px; padding: 8px 0;
    }
    .composer textarea::placeholder { color: var(--text-mute); }
    .composer__send {
      width: 42px; height: 42px; flex-shrink: 0;
      border: none; border-radius: 13px; cursor: pointer;
      display: grid; place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 16px var(--accent-soft);
      transition: transform 0.15s var(--ease), opacity 0.15s, box-shadow 0.18s;
    }
    .composer__send:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 10px 22px var(--accent-ring); }
    .composer__send:active { transform: scale(0.96); }
    .composer__send:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Overlay para mobile */
    .scrim {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(10, 12, 24, 0.45);
      opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s;
    }
    .scrim.is-open { opacity: 1; visibility: visible; }

    @media (max-width: 860px) {
      .app { padding: 12px; gap: 12px; }
      .sidebar {
        position: fixed; left: 12px; top: 12px; bottom: 12px; z-index: 50;
        transform: translateX(calc(-100% - 16px));
        transition: transform var(--speed) var(--ease);
      }
      .sidebar.is-mobile-open { transform: translateX(0); }
      .sidebar.is-collapsed { width: var(--sidebar-w); }
      .topbar__menu { display: grid; }
      .topbar__profile .who { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    /* ===================== AUTENTICAÇÃO ===================== */
    /* Estados: state-checking (boot) | state-anon (login) | state-authed (app) */
    body:not(.state-authed) .app { display: none; }
    #authBoot, #authScreen { display: none; }
    body.state-checking #authBoot { display: flex; }
    body.state-anon #authScreen { display: flex; }

    #authBoot {
      position: fixed; inset: 0; z-index: 1000;
      align-items: center; justify-content: center;
    }
    .boot-spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 3px solid var(--glass-border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #authScreen {
      position: fixed; inset: 0; z-index: 1000;
      align-items: center; justify-content: center;
      padding: 24px; overflow-y: auto;
    }
    .auth__card { width: 100%; max-width: 412px; border-radius: var(--radius-lg); padding: 30px 28px; }
    .auth__brand { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 22px; }
    .auth__brand .brand__logo { width: 44px; height: 44px; }
    .auth__brand .txt strong { font-size: 18px; font-weight: 700; display: block; }
    .auth__brand .txt span { font-size: 12px; color: var(--text-mute); }

    .auth__tabs {
      display: flex; gap: 6px; padding: 5px; margin-bottom: 22px;
      background: var(--neu-bg); border-radius: 12px;
      box-shadow: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light);
    }
    .auth__tab {
      flex: 1; border: none; cursor: pointer; padding: 9px; border-radius: 9px;
      background: transparent; color: var(--text-soft);
      font: inherit; font-size: 13.5px; font-weight: 600;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
    }
    .auth__tab.is-active { color: var(--accent); background: var(--glass-bg-strong); box-shadow: 0 3px 8px rgba(31,38,80,0.12); }

    .auth__form { display: none; flex-direction: column; gap: 14px; }
    .auth__form.is-active { display: flex; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12.5px; font-weight: 600; color: var(--text-soft); }
    .field input {
      border: 1px solid var(--glass-border); background: var(--neu-bg);
      box-shadow: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light);
      border-radius: 11px; padding: 12px 14px;
      color: var(--text); font: inherit; font-size: 14px; outline: none;
      transition: box-shadow 0.18s, border-color 0.18s;
    }
    .field input:focus { border-color: var(--accent-ring); box-shadow: inset 1px 1px 3px var(--neu-dark), 0 0 0 3px var(--accent-soft); }
    .field input[type="range"] { padding: 0; background: transparent; border: none; box-shadow: none; height: 28px; accent-color: var(--accent, #22c1b7); }
    .field input[type="range"]:focus { box-shadow: none; }
    .field input::placeholder { color: var(--text-mute); }
    /* Preferências do Jarvis: selects e range com o mesmo visual neumórfico dos inputs */
    .field select {
      border: 1px solid var(--glass-border); background: var(--neu-bg);
      box-shadow: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light);
      border-radius: 11px; padding: 12px 14px; width: 100%;
      color: var(--text); font: inherit; font-size: 14px; outline: none; cursor: pointer;
      transition: box-shadow 0.18s, border-color 0.18s;
    }
    .field select:focus { border-color: var(--accent-ring); box-shadow: inset 1px 1px 3px var(--neu-dark), 0 0 0 3px var(--accent-soft); }
    .field select option { background: var(--neu-bg); color: var(--text); }
    .field input[type="range"] { padding: 0; box-shadow: none; border: none; accent-color: var(--accent, #2fd4c6); cursor: pointer; }

    .auth__avatar { display: flex; flex-direction: column; align-items: center; gap: 9px; margin-bottom: 2px; }
    .auth__avatar-pic {
      width: 86px; height: 86px; border-radius: 50%;
      background: var(--neu-bg);
      box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light);
      display: grid; place-items: center; overflow: hidden;
      color: var(--text-mute); cursor: pointer;
    }
    .auth__avatar-pic img { width: 100%; height: 100%; object-fit: cover; }
    .auth__avatar-hint { font-size: 11.5px; color: var(--text-mute); }

    .auth__submit {
      margin-top: 4px; border: none; cursor: pointer; padding: 13px; border-radius: 12px;
      color: #fff; font: inherit; font-size: 14.5px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 20px var(--accent-soft);
      transition: transform 0.15s var(--ease), box-shadow 0.18s, opacity 0.18s;
    }
    .auth__submit:hover { transform: translateY(-1px); box-shadow: 0 12px 26px var(--accent-ring); }
    .auth__submit:disabled { opacity: 0.6; cursor: progress; transform: none; }

    .auth__error {
      display: none; font-size: 12.5px; color: #ff6b6b;
      background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.28);
      padding: 9px 12px; border-radius: 10px;
    }
    .auth__error.is-show { display: block; }

    /* Campo de senha com botão mostrar/ocultar */
    .input-wrap { position: relative; display: flex; }
    .input-wrap input { flex: 1; padding-right: 46px; }
    .pw-toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 34px; height: 34px; border: none; background: transparent;
      display: grid; place-items: center; cursor: pointer;
      color: var(--text-mute); border-radius: 8px;
      transition: color 0.18s;
    }
    .pw-toggle:hover { color: var(--accent); }
    .pw-toggle:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }
    .pw-toggle .eye-off { display: none; }
    .pw-toggle.is-on .eye { display: none; }
    .pw-toggle.is-on .eye-off { display: block; }

    /* Avatares com imagem (topbar, popover, mensagens) */
    .avatar img, .msg__avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
    .avatar.has-img { background: none; }
    .msg__img { max-width: 280px; max-height: 220px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--glass-border); display: block; cursor: zoom-in; }

    /* Chip de arquivo (no preview do composer e dentro das mensagens) */
    .att-chip {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 8px 12px; border-radius: 12px; margin-bottom: 8px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      color: var(--text); font-size: 13px; max-width: 240px; cursor: pointer;
    }
    .att-chip svg { color: var(--accent); flex-shrink: 0; }
    .att-chip .att-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .composer__preview img.att-thumb { max-height: 84px; max-width: 160px; border-radius: 12px; border: 1px solid var(--glass-border); display: block; }

    /* Drag & drop */
    .dropzone {
      position: absolute; inset: 10px; z-index: 20;
      border: 2px dashed var(--accent-ring); border-radius: var(--radius-lg);
      background: var(--accent-soft);
      display: none; align-items: center; justify-content: center; text-align: center;
      color: var(--accent); font-weight: 600;
      -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    }
    .dropzone.is-active { display: flex; }
    .dropzone__inner { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 14.5px; }

    /* Lightbox (abrir anexos) */
    .lightbox {
      position: fixed; inset: 0; z-index: 1200;
      display: none; align-items: center; justify-content: center;
      background: rgba(8, 10, 20, 0.82); padding: 30px;
    }
    .lightbox.is-open { display: flex; }
    .lightbox__content { max-width: 90vw; max-height: 86vh; overflow: auto; }
    .lightbox__content img { max-width: 90vw; max-height: 86vh; border-radius: 12px; display: block; }
    .lightbox__content pre {
      background: #11141f; color: #e6e8f0; padding: 20px; border-radius: 12px;
      max-width: 86vw; white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.5; margin: 0;
    }
    .lightbox__close {
      position: absolute; top: 18px; right: 22px; width: 40px; height: 40px;
      border: none; border-radius: 10px; cursor: pointer; font-size: 22px; line-height: 1;
      background: rgba(255, 255, 255, 0.14); color: #fff;
    }

    /* Botão "Ingerir na wiki" (sugestão pós-anexo) */
    .ingest-btn {
      margin-top: 10px; display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 13px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--accent-ring); background: var(--accent-soft);
      color: var(--accent); font: inherit; font-size: 12.5px; font-weight: 600;
      transition: background 0.18s;
    }
    .ingest-btn:hover { background: var(--glass-bg-strong); }
    .ingest-btn:disabled { opacity: 0.6; cursor: progress; }

    /* Painel de vozes (/voz) */
    .voz-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .voz-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 7px 10px; border-radius: 10px; border: 1px solid var(--glass-border);
      background: var(--glass-bg); font-size: 12.5px;
    }
    .voz-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .voz-atual { color: var(--accent); font-weight: 600; }
    .voz-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .voz-btn {
      padding: 5px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600;
      border: 1px solid var(--accent-ring); background: var(--accent-soft); color: var(--accent); transition: background 0.18s;
    }
    .voz-btn:hover { background: var(--glass-bg-strong); }
    .voz-btn:disabled { opacity: 0.6; cursor: progress; }

    /* Bloco "Tom expressivo (Gemini TTS)" no painel /voz */
    .vg-box { margin: 10px 0; padding: 12px; border: 1px solid var(--accent-ring); border-radius: 12px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 8px; }
    .vg-row { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .vg-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
    .vg-sub { font-size: 11.5px; color: var(--text-mute); line-height: 1.35; }
    .vg-in { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--accent-ring); background: var(--glass-bg); color: var(--text); font: inherit; font-size: 13px; }
    .vg-actions { display: flex; gap: 8px; margin-top: 2px; }

    /* Lista de conversas na sidebar */
    .conv-new {
      margin-left: auto; width: 26px; height: 26px; flex-shrink: 0;
      border: none; border-radius: 7px; cursor: pointer;
      display: grid; place-items: center; color: var(--text-soft); background: transparent;
      transition: color 0.15s, background 0.15s;
    }
    .conv-new:hover { color: var(--accent); background: var(--accent-soft); }
    .conv-list { list-style: none; margin: 2px 0 4px; padding: 0 0 0 6px; max-height: 240px; overflow-y: auto; }
    .conv-list::-webkit-scrollbar { width: 5px; }
    .conv-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
    .conv-item {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 10px; border-radius: 8px; cursor: pointer;
      color: var(--text-soft); font-size: 12.5px; white-space: nowrap;
    }
    .conv-item:hover { background: var(--accent-soft); color: var(--text); }
    .conv-item.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .conv-item .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .conv-del { border: none; background: transparent; color: var(--text-mute); cursor: pointer; opacity: 0; font-size: 15px; line-height: 1; padding: 0 2px; }
    .conv-item:hover .conv-del { opacity: 1; }
    .conv-del:hover { color: #ff6b6b; }
    .conv-empty { padding: 8px 10px; font-size: 12px; color: var(--text-mute); }
    .sidebar.is-collapsed .conv-list, .sidebar.is-collapsed .conv-new { display: none; }

    /* ===================== VIEW: CONEXÕES WHATSAPP ===================== */
    .wpp-view {
      flex: 1; min-height: 0; position: relative; z-index: 1;
      border-radius: var(--radius-lg); padding: 24px clamp(16px, 5vw, 40px); overflow-y: auto;
    }
    .wpp-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .wpp-head h2 { font-size: 20px; font-weight: 700; }
    .wpp-head p { font-size: 13px; color: var(--text-mute); }
    .wpp-instances { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .wpp-card { border: 1px solid var(--glass-border); background: var(--glass-bg); border-radius: var(--radius-md); padding: 18px; }
    .wpp-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; word-break: break-all; }
    .wpp-badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--glass-border); color: var(--text-soft); margin-bottom: 14px; }
    .wpp-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-mute); }
    .wpp-badge.on { color: #2fcf6b; } .wpp-badge.on .dot { background: #2fcf6b; box-shadow: 0 0 0 3px rgba(47,207,107,.18); }
    .wpp-badge.off { color: #ff9f43; } .wpp-badge.off .dot { background: #ff9f43; }
    .wpp-card button {
      width: 100%; border: none; border-radius: 10px; cursor: pointer; padding: 10px; font: inherit; font-size: 13.5px; font-weight: 600;
      color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    .wpp-card button:hover { transform: translateY(-1px); }
    .qr-body { padding: 10px 0 6px; }
    .qr-body img { width: 260px; height: 260px; max-width: 100%; border-radius: 12px; background: #fff; padding: 8px; }
    .qr-status { margin-top: 14px; font-size: 13.5px; color: var(--text-soft); }
    .qr-spin { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--glass-border); border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 26px auto; }
    .wpp-actions { display: flex; gap: 8px; }
    .wpp-num { font-size: 12.5px; color: var(--text-mute); margin-bottom: 12px; }
    .btn-ghost.is-on { color: #16a34a; border-color: rgba(22,163,74,.45); background: rgba(22,163,74,.10); }

    /* ===================== MODAL (editar perfil) ===================== */
    .modal { position: fixed; inset: 0; z-index: 1100; display: none; align-items: center; justify-content: center; padding: 24px; }
    .modal.is-open { display: flex; }
    .modal__backdrop {
      position: absolute; inset: 0;
      background: rgba(10, 12, 24, 0.5);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    }
    .modal__card {
      position: relative; width: 100%; max-width: 440px;
      max-height: calc(100vh - 48px); overflow-y: auto;
      border-radius: var(--radius-lg); padding: 24px 26px;
    }
    .modal__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .modal__head h2 { font-size: 18px; font-weight: 700; }
    .modal__close {
      width: 34px; height: 34px; border: none; border-radius: 9px; cursor: pointer;
      display: grid; place-items: center; color: var(--text-soft);
      background: var(--neu-bg);
      box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light);
      transition: color 0.18s;
    }
    .modal__close:hover { color: var(--accent); }
    .modal__body { display: flex; flex-direction: column; gap: 14px; }
    .field-hint { font-size: 11px; color: var(--text-mute); }
    .pm-divider {
      font-size: 11px; font-weight: 600; color: var(--text-mute);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--glass-border);
    }
    .pm-ok {
      display: none; font-size: 12.5px; color: #1f9d57;
      background: rgba(47, 207, 107, 0.12); border: 1px solid rgba(47, 207, 107, 0.3);
      padding: 9px 12px; border-radius: 10px;
    }
    .pm-ok.is-show { display: block; }
    .modal__foot { display: flex; gap: 10px; margin-top: 8px; }
    .modal__foot .auth__submit { flex: 1; margin-top: 0; }
    .btn-ghost {
      border: 1px solid var(--glass-border); background: transparent;
      color: var(--text-soft); cursor: pointer;
      padding: 13px 18px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600;
      transition: color 0.18s, border-color 0.18s;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--accent-ring); }

    /* ===== Tuning UI/UX (rodada neumorph + glass) ===== */
    /* Micro-interação: mensagens entram com fade-up suave */
    .msg { animation: msgIn .32s cubic-bezier(.22,.61,.36,1) both; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }

    /* Meta da resposta: hora/latência + botão ouvir lado a lado */
    .msg__meta { display: inline-flex; align-items: center; gap: 8px; }
    .msg.is-user .msg__meta { justify-content: flex-end; }
    .msg__tts {
      border: 1px solid var(--glass-border); background: var(--accent-soft); color: var(--accent);
      cursor: pointer; border-radius: 999px; width: 24px; height: 24px; line-height: 1;
      font-size: 12px; display: inline-grid; place-items: center; opacity: .55;
      transition: opacity .15s, transform .12s, background .15s;
    }
    .msg:hover .msg__tts { opacity: 1; }
    .msg__tts:hover { transform: scale(1.12); }
    .msg__tts:disabled { cursor: default; opacity: .6; }
    .msg__fb {
      border: 1px solid var(--glass-border); background: transparent; color: var(--text-soft);
      cursor: pointer; border-radius: 999px; width: 24px; height: 24px; line-height: 1;
      font-size: 12px; display: inline-grid; place-items: center; opacity: .45;
      transition: opacity .15s, transform .12s, background .15s;
    }
    .msg:hover .msg__fb { opacity: .85; }
    .msg__fb:hover { transform: scale(1.12); opacity: 1; }
    .msg__fb.is-on { opacity: 1; background: var(--accent-soft); border-color: var(--accent); }
    .msg__fb:disabled { cursor: default; }

    /* Botão renomear conversa na sidebar */
    .conv-edit {
      border: none; background: transparent; color: var(--text-mute); cursor: pointer;
      opacity: 0; font-size: 12.5px; line-height: 1; padding: 0 2px; transition: color .15s;
    }
    .conv-item:hover .conv-edit { opacity: 1; }
    .conv-edit:hover { color: var(--accent); }

    /* Indicador de status no header (Online / Reserva / Offline) */
    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #2ecc71; vertical-align: middle; margin-right: 6px;
      animation: statusPulse 2.4s infinite;
    }
    .status-dot.reserva { background: #f1c40f; animation-name: statusPulseY; }
    .status-dot.offline { background: #e74c3c; animation: none; }
    @keyframes statusPulse  { 0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)} 70%{box-shadow:0 0 0 6px rgba(46,204,113,0)} 100%{box-shadow:0 0 0 0 rgba(46,204,113,0)} }
    @keyframes statusPulseY { 0%{box-shadow:0 0 0 0 rgba(241,196,15,.5)} 70%{box-shadow:0 0 0 6px rgba(241,196,15,0)} 100%{box-shadow:0 0 0 0 rgba(241,196,15,0)} }

    /* ===== Dashboard · Centro de Comando ===== */
    .dash-view { flex: 1; padding: 26px; border-radius: var(--radius-lg, 18px); overflow-y: auto; }
    .dash-view::-webkit-scrollbar { width: 8px; }
    .dash-view::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
    .dash-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; }
    .dash-head h2 { font-size: 24px; font-weight: 800; }
    .dash-head p { font-size: 13px; color: var(--text-mute); margin-top: 3px; }
    .dash-turno-pill {
      display: inline-flex; align-items: center; gap: 5px; vertical-align: middle;
      font-size: 12px; font-weight: 700; letter-spacing: .2px; cursor: pointer;
      padding: 3px 11px; border-radius: 999px; margin-left: 8px;
      background: var(--accent-soft, rgba(34,193,183,.14)); color: var(--accent, #14b8a6);
      border: 1px solid var(--accent-ring, rgba(34,193,183,.4)); transition: transform .12s, filter .12s;
